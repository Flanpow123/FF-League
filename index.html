<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigma Pi B</title>
<meta name="description" content="Standings, waivers, power rankings and unsolicited opinions from the Sigma Pi B fantasy football league.">
<meta name="theme-color" content="#0D1411">
<meta property="og:title" content="Sigma Pi B">
<meta property="og:description" content="Standings, waivers, power rankings and unsolicited opinions.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230D1411'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial,sans-serif' font-size='19' font-weight='bold' fill='%23F0C24B' text-anchor='middle'%3E%CF%83%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --turf:#0D1411; --panel:#141F1A; --panel2:#1B2A23; --line:#25392F;
    --text:#E9EFEA; --dim:#8CA398;
    --gold:#F0C24B; --flag:#E2593B; --good:#5FCB8B; --cool:#6FB3D2; --violet:#A98BD6;
    --sans:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
    --cond:'Barlow Condensed','Barlow',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--turf);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto;padding:0 16px 80px}

  .masthead{padding:28px 0 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .masthead h1{font-family:var(--cond);font-weight:700;font-size:clamp(34px,7vw,52px);letter-spacing:-.01em;line-height:.95;margin:0}
  .masthead .sub{color:var(--dim);font-size:14px;margin-top:6px}
  .clock{font-family:var(--cond);font-weight:600;font-size:15px;color:var(--gold);border:1px solid var(--line);border-radius:2px;padding:5px 10px;white-space:nowrap}

  nav{display:flex;gap:2px;margin:0 -16px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--turf);z-index:20}
  nav button{font-family:var(--cond);font-size:19px;font-weight:600;background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);padding:6px 12px;cursor:pointer;white-space:nowrap}
  nav button:hover{color:var(--text)}
  nav button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
  nav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  section[hidden]{display:none}
  section{padding-top:22px}
  h2{font-family:var(--cond);font-weight:600;font-size:26px;margin:0 0 4px;letter-spacing:.01em}
  .note{color:var(--dim);font-size:14px;margin:0 0 18px}

  /* ---------- the wire (auto-generated takes) ---------- */
  .wire{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-bottom:34px}
  .wire-item{background:var(--panel);padding:12px 14px}
  .wire-item .hl{font-family:var(--cond);font-weight:600;font-size:20px;line-height:1.15;margin-bottom:3px}
  .wire-item .dt{color:var(--dim);font-size:13.5px;font-variant-numeric:tabular-nums}
  .wire-item .tag{color:var(--gold);font-family:var(--cond);font-size:14px;font-weight:600;margin-right:8px}

  .toc{margin-bottom:34px}
  .toc-item{
    display:block;width:100%;text-align:left;border:none;
    background:var(--panel);color:inherit;font:inherit;cursor:pointer;
    padding:12px 14px;
  }
  .toc-item:hover{background:var(--panel2)}
  .toc-item:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
  .toc-item .hl{display:block;font-family:var(--cond);font-weight:600;font-size:20px;line-height:1.15;margin-bottom:3px}
  .toc-item:hover .hl{color:var(--gold)}
  .toc-item .dt{display:block;color:var(--dim);font-size:13.5px}
  .story{scroll-margin-top:64px}

  /* ---------- stories ---------- */
  .story{border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:18px 16px;margin-bottom:14px}
  .story h3{font-family:var(--cond);font-weight:700;font-size:clamp(23px,4.4vw,30px);line-height:1.08;margin:0 0 10px}
  .story p{margin:0 0 11px;font-size:15.5px;max-width:66ch}
  .story p:last-of-type{margin-bottom:0}
  .sample{border:1px dashed var(--gold);color:var(--gold);font-size:13px;border-radius:2px;padding:5px 9px;margin-bottom:12px}

  .takes{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:12px}
  .take{display:flex;gap:11px}
  .face{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:700;font-size:16px;color:var(--turf)}
  .take .body{flex:1;min-width:0}
  .take .who{font-weight:600;font-size:14.5px}
  .take .role{color:var(--dim);font-weight:400;font-size:13px;margin-left:7px}
  .take .txt{font-size:15px;margin-top:2px;max-width:64ch}

  .btn{font-family:var(--cond);font-size:18px;font-weight:600;background:var(--gold);color:var(--turf);border:none;border-radius:3px;padding:9px 16px;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
  .btn.ghost{background:none;color:var(--dim);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--text)}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:26px 0 0;padding-top:18px;border-top:1px solid var(--line)}
  .bar .hint{color:var(--dim);font-size:13.5px;flex:1;min-width:200px}

  /* ---------- scoreboard ---------- */
  .board{display:grid;gap:10px}
  .game{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 14px;display:grid;gap:8px}
  .side{display:flex;align-items:center;gap:10px}
  .side .pts{margin-left:auto;font-family:var(--cond);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--dim)}
  .side.lead .pts{color:var(--gold)}
  .side.lead .tname{color:var(--text)}
  .tname{font-weight:600;font-size:15px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mgr{color:var(--dim);font-size:12.5px;font-weight:400}
  .av{width:30px;height:30px;border-radius:50%;background:var(--panel2);flex:none;object-fit:cover}
  .gap{border-top:1px dashed var(--line);padding-top:7px;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}

  /* ---------- tables ---------- */
  .scroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
  table{border-collapse:collapse;width:100%;min-width:560px}
  th,td{padding:9px 8px;text-align:right;font-variant-numeric:tabular-nums;font-size:14.5px}
  th{font-family:var(--cond);font-weight:600;font-size:15px;color:var(--dim);border-bottom:1px solid var(--line);white-space:nowrap}
  td{border-bottom:1px solid rgba(37,57,47,.55)}
  th:first-child,td:first-child{text-align:center;width:34px;padding-left:0;color:var(--dim)}
  th:nth-child(2),td:nth-child(2){text-align:left}
  tbody tr:hover{background:var(--panel)}
  .team-cell{display:flex;align-items:center;gap:9px;min-width:190px}
  .team-cell .tname{color:var(--text)}
  .rank-1 td:first-child{color:var(--gold);font-weight:600}
  .pos{color:var(--good)} .neg{color:var(--flag)}

  /* ---------- moves ---------- */
  .feed{display:grid;gap:10px}
  .move{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 14px}
  .move-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .kind{font-family:var(--cond);font-weight:600;font-size:15px;color:var(--turf);background:var(--gold);border-radius:2px;padding:1px 7px}
  .kind.trade{background:var(--good)}
  .when{color:var(--dim);font-size:12.5px;margin-left:auto}
  .line{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:14.5px}
  .line .pav{width:26px;height:26px;border-radius:3px;background:var(--panel2);flex:none;object-fit:cover}
  .who{color:var(--dim);font-size:13px}
  .bids{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}
  .bid{display:flex;gap:10px;font-size:13.5px;color:var(--dim);padding:2px 0}
  .bid b{font-family:var(--cond);font-size:16px;font-weight:700;min-width:44px;color:var(--dim);font-variant-numeric:tabular-nums}
  .bid.win{color:var(--text)} .bid.win b{color:var(--gold)}
  .bid .lbl{margin-left:auto;font-size:12px}

  .msg{border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:18px;color:var(--dim);font-size:15px}
  .msg.bad{border-color:var(--flag);color:var(--text)}
  .msg code{font-size:13px;color:var(--gold);word-break:break-all}
  .season-block{margin-bottom:30px}
  .season-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}
  .season-head h3{font-family:var(--cond);font-weight:700;font-size:24px;margin:0}
  .champ{color:var(--gold);font-size:14px}
  footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);color:var(--dim);font-size:13px}
  @media (prefers-reduced-motion:no-preference){
    .game,.move,.story{animation:in .3s ease both}
    @keyframes in{from{opacity:0}to{opacity:1}}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div>
      <h1 id="leagueName">Loading league</h1>
      <div class="sub" id="leagueSub">Connecting to Sleeper</div>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <nav role="tablist">
    <button role="tab" data-tab="news" aria-selected="true">Newsroom</button>
    <button role="tab" data-tab="week" aria-selected="false">Scoreboard</button>
    <button role="tab" data-tab="standings" aria-selected="false">Standings</button>
    <button role="tab" data-tab="power" aria-selected="false">Power</button>
    <button role="tab" data-tab="draft" aria-selected="false">Draft</button>
    <button role="tab" data-tab="moves" aria-selected="false">Moves</button>
    <button role="tab" data-tab="records" aria-selected="false">Records</button>
    <button role="tab" data-tab="history" aria-selected="false">History</button>
  </nav>

  <section id="tab-news"><div class="msg">Reading the league.</div></section>
  <section id="tab-week" hidden></section>
  <section id="tab-standings" hidden></section>
  <section id="tab-power" hidden></section>
  <section id="tab-draft" hidden></section>
  <section id="tab-moves" hidden></section>
  <section id="tab-records" hidden></section>
  <section id="tab-history" hidden></section>

  <footer>
    Sigma Pi B. Scores, rosters and transactions come straight from Sleeper and update on their own.
    The analysts are fictional and their opinions are their own problem.
  </footer>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   CONFIG
   ============================================================ */
var LEAGUE_ID = "1385278901562929152";   // Sigma Pi B, 2026

/* The analyst characters. Rename them, recolor them, add more,
   delete the ones you hate. The key on the left is what news.json
   refers to. */
var ANALYSTS = {
  analyst:     { name:"Ward Delaney",  role:"CBS Sports, senior NFL columnist", color:"var(--cool)"   },
  firestarter: { name:"Deacon Pyle",   role:"ESPN, morning debate show",       color:"var(--flag)"   },
  quant:       { name:"Odessa Prine",  role:"The Athletic, numbers desk",       color:"var(--gold)"   },
  troll:       { name:"Roy Tannehill", role:"FS1, afternoon drive",            color:"var(--violet)" }
};

/* Where the written stories come from.
   "news.json"  = a file sitting next to this page. Updating it means redeploying.
   A full URL   = anywhere else, e.g. a GitHub gist raw link. Updating it means
                  editing that file and nothing else. No redeploy, no credits. */
var NEWS_URL = "news.json";

/* Past editions. The folder needs an index.json listing them, because a
   static host cannot list a directory for us. */
var ARCHIVE_URL = "archive/";

var API = "https://api.sleeper.app/v1";

/* Projections live on Sleeper's internal host, not the documented one.
   It is undocumented and unsupported, so everything here degrades quietly
   if it disappears or refuses cross-origin requests. */
var PROJ_API = "https://api.sleeper.com";

/* Add ?desk to the URL to reveal the briefing tools. Without it the
   site is read-only and gives no hint that a human is involved. */
var DESK = /[?&]desk\b/.test(location.search);

var S = {
  league:null, users:{}, rosters:[], week:1, lastWeek:1,
  matchups:{}, transactions:[], claims:[], players:null,
  news:null, historyLoaded:false, finalWeek:0,
  regWeeks:14, draftPicks:null, eff:null, history:null, historyPromise:null,
  projections:null, projError:null, projWeek:null,
  archive:null, archivePromise:null, archiveError:null
};

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function num(n,d){ d=d==null?2:d; var v=Number(n); return isFinite(v)?v.toFixed(d):"0.00"; }
function get(path){
  return fetch(API+path).then(function(r){
    if(!r.ok) throw new Error("Sleeper returned "+r.status+" for "+path);
    return r.json();
  });
}
function pts(a,b){ return (Number(a)||0) + (Number(b)||0)/100; }
function rosterById(id){
  for(var i=0;i<S.rosters.length;i++){ if(S.rosters[i].roster_id===id) return S.rosters[i]; }
  return null;
}
function teamName(rid){
  var r=rosterById(rid); if(!r) return "Roster "+rid;
  var u=S.users[r.owner_id]; if(!u) return "Roster "+rid;
  return (u.metadata&&u.metadata.team_name)||u.display_name||("Roster "+rid);
}
function manager(rid){ var r=rosterById(rid),u=r&&S.users[r.owner_id]; return u?(u.display_name||""):""; }
function avatar(rid){
  var r=rosterById(rid),u=r&&S.users[r.owner_id];
  return u&&u.avatar?"https://sleepercdn.com/avatars/thumbs/"+u.avatar:"";
}
function teamCell(rid){
  var av=avatar(rid),mg=manager(rid);
  return '<div class="team-cell">'
    +(av?'<img class="av" src="'+esc(av)+'" alt="" loading="lazy">':'<div class="av"></div>')
    +'<div><div class="tname">'+esc(teamName(rid))+'</div>'
    +(mg?'<div class="mgr">'+esc(mg)+'</div>':'')+'</div></div>';
}
function playerName(pid){
  if(!pid) return "";
  if(S.players&&S.players[pid]){
    var p=S.players[pid];
    return p.full_name||((p.first_name||"")+" "+(p.last_name||"")).trim()||pid;
  }
  if(/^[A-Z]{2,3}$/.test(pid)) return pid+" defense";
  return "Player "+pid;
}
function playerMeta(pid){
  var p=S.players&&S.players[pid]; if(!p) return "";
  return [p.position,p.team].filter(Boolean).join(" · ");
}
function playerImg(pid){
  if(/^[A-Z]{2,3}$/.test(pid)) return "https://sleepercdn.com/images/team_logos/nfl/"+pid.toLowerCase()+".png";
  return "https://sleepercdn.com/content/nfl/players/thumb/"+pid+".jpg";
}
function playerLine(pid){
  var meta=playerMeta(pid);
  return '<div class="line">'
    +'<img class="pav" src="'+esc(playerImg(pid))+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
    +'<span>'+esc(playerName(pid))+'</span>'
    +(meta?'<span class="who">'+esc(meta)+'</span>':'')+'</div>';
}
function when(ms){
  if(!ms) return "";
  var d=new Date(Number(ms)); if(isNaN(d.getTime())) return "";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function fail(msg){
  $("tab-news").innerHTML='<div class="msg bad"><b>Could not load the league.</b><br>'+esc(msg)
    +'<br><br>Check your connection and reload. If it keeps happening, something has changed on Sleeper&rsquo;s end.</div>';
}

/* ============================================================
   ANALYTICS ENGINE
   ============================================================ */

var SLOT_ELIGIBILITY = {
  QB:["QB"], RB:["RB"], WR:["WR"], TE:["TE"], K:["K"], DEF:["DEF"],
  FLEX:["RB","WR","TE"],
  WRRB_FLEX:["RB","WR"],
  REC_FLEX:["WR","TE"],
  WRRB_WRT:["RB","WR","TE"],
  SUPER_FLEX:["QB","RB","WR","TE"],
  IDP_FLEX:["DL","LB","DB"],
  DL:["DL"], LB:["LB"], DB:["DB"]
};
var BENCH_SLOTS = {BN:1, IR:1, TAXI:1};

function positionsOf(pid, players){
  var p = players && players[pid];
  if(p){
    if(p.fantasy_positions && p.fantasy_positions.length) return p.fantasy_positions;
    if(p.position) return [p.position];
  }
  if(/^[A-Z]{2,4}$/.test(pid)) return ["DEF"];
  return [];
}

/* Best score obtainable from these players under these slot rules. */
function optimalLineup(playerIds, pointsMap, rosterPositions, players){
  var slots = (rosterPositions||[]).filter(function(s){ return !BENCH_SLOTS[s]; });
  if(!slots.length) return null;

  var pool = playerIds.map(function(pid){
    return { pid:pid, pts:Number(pointsMap[pid])||0, pos:positionsOf(pid, players) };
  });

  var order = slots.map(function(s,i){
    var elig = SLOT_ELIGIBILITY[s] || [s];
    return { slot:s, elig:elig, i:i };
  }).sort(function(a,b){ return a.elig.length - b.elig.length; });

  function eligible(cand, slot){
    for(var i=0;i<slot.elig.length;i++){
      if(cand.pos.indexOf(slot.elig[i])>=0) return true;
    }
    return false;
  }

  // Most-constrained slot first, take the best available body.
  var used = {}, assign = [];
  order.forEach(function(slot){
    var best=null;
    pool.forEach(function(c){
      if(used[c.pid]) return;
      if(!eligible(c,slot)) return;
      if(!best||c.pts>best.pts) best=c;
    });
    if(best){ used[best.pid]=1; assign.push({slot:slot, cand:best}); }
    else assign.push({slot:slot, cand:null});
  });

  // Greedy can leave points on the table. Try swaps until nothing improves.
  var improved = true, guard = 0;
  while(improved && guard++ < 40){
    improved = false;
    for(var a=0;a<assign.length;a++){
      for(var b=a+1;b<assign.length;b++){
        var A=assign[a], B=assign[b];
        if(A.cand && B.cand){
          if(eligible(A.cand,B.slot) && eligible(B.cand,A.slot)){
            // swapping two filled slots never changes the total, skip
          }
        }
        // try moving an unused player into a slot, replacing its occupant
      }
      // replacement pass: is there a bench player who beats this slot's pick?
      var slotA = assign[a];
      var bestAlt = null;
      pool.forEach(function(c){
        if(used[c.pid]) return;
        if(!eligible(c, slotA.slot)) return;
        if(!bestAlt || c.pts > bestAlt.pts) bestAlt = c;
      });
      if(bestAlt && (!slotA.cand || bestAlt.pts > slotA.cand.pts)){
        if(slotA.cand) delete used[slotA.cand.pid];
        used[bestAlt.pid]=1;
        slotA.cand = bestAlt;
        improved = true;
      }
    }
  }

  var total = 0, lineup = [];
  assign.forEach(function(x){
    if(x.cand){ total += x.cand.pts; lineup.push({slot:x.slot.slot, pid:x.cand.pid, pts:x.cand.pts}); }
  });
  return { points: total, lineup: lineup };
}

/* Score a predicted ordering against how things actually turned out.
   Pairwise accuracy is the readable one: of every pair of teams, how
   often did you put them in the right order. */
function scoreRanking(predicted, actualRank){
  var list = (predicted||[]).filter(function(id){ return actualRank[id]!=null; });
  var n = list.length;
  if(n < 2) return null;

  var sumErr = 0, worst = null, best = null;
  list.forEach(function(id,i){
    var pred = i+1, act = actualRank[id], err = Math.abs(pred-act);
    sumErr += err;
    if(!worst || err > worst.err) worst = {id:id, err:err, predicted:pred, actual:act};
    if(!best  || err < best.err)  best  = {id:id, err:err, predicted:pred, actual:act};
  });

  var pairs = 0, correct = 0;
  for(var a=0; a<n; a++){
    for(var b=a+1; b<n; b++){
      pairs++;
      if(actualRank[list[a]] < actualRank[list[b]]) correct++;
    }
  }

  return {
    n:n, pairs:pairs, correct:correct,
    pairwise: pairs ? correct/pairs : 0,
    mae: sumErr/n,
    exact: list.filter(function(id,i){ return actualRank[id]===i+1; }).length,
    worst: worst, best: best,
    top: {id:list[0], actual:actualRank[list[0]]},
    bottom: {id:list[n-1], actual:actualRank[list[n-1]]}
  };
}

/* Blend what a team has actually scored with what their roster projects.
   Early on the projection carries it; by midseason the real scores do. */
function blendMean(observed, n, projected, priorWeight){
  var pw = priorWeight==null ? 4 : priorWeight;
  if(projected==null) return observed;
  if(!n) return projected;
  var w = n/(n+pw);
  return w*observed + (1-w)*projected;
}

/* Standard normal, Box-Muller. */
function gauss(){
  var u=0,v=0;
  while(u===0) u=Math.random();
  while(v===0) v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

function meanSd(list){
  if(!list.length) return {mean:0, sd:0, n:0};
  var m = list.reduce(function(t,v){return t+v;},0)/list.length;
  if(list.length<2) return {mean:m, sd:0, n:1};
  var varc = list.reduce(function(t,v){return t+(v-m)*(v-m);},0)/(list.length-1);
  return {mean:m, sd:Math.sqrt(varc), n:list.length};
}

/* Monte Carlo the rest of the regular season. */
function simulateSeason(opts){
  var teams = opts.teams;            // [{rid, wins, pts, mean, sd}]
  var schedule = opts.schedule;      // [{week, pairs:[[ridA,ridB],...]}]
  var spots = opts.playoffSpots || 6;
  var runs = opts.runs || 5000;

  var made={}, top={}, idx={};
  teams.forEach(function(t,i){ made[t.rid]=0; top[t.rid]=0; idx[t.rid]=i; });

  var n = teams.length;
  for(var r=0;r<runs;r++){
    var wins=new Array(n), pts=new Array(n);
    for(var i=0;i<n;i++){ wins[i]=teams[i].wins; pts[i]=teams[i].pts; }

    for(var w=0;w<schedule.length;w++){
      var pairs=schedule[w].pairs;
      for(var p=0;p<pairs.length;p++){
        var ia=idx[pairs[p][0]], ib=idx[pairs[p][1]];
        if(ia===undefined||ib===undefined) continue;
        var sa=teams[ia].mean+teams[ia].sd*gauss();
        var sb=teams[ib].mean+teams[ib].sd*gauss();
        if(sa<0) sa=0; if(sb<0) sb=0;
        pts[ia]+=sa; pts[ib]+=sb;
        if(sa>sb) wins[ia]++; else if(sb>sa) wins[ib]++;
        else { wins[ia]+=0.5; wins[ib]+=0.5; }
      }
    }

    var order=[];
    for(var k=0;k<n;k++) order.push({i:k, w:wins[k], p:pts[k]});
    order.sort(function(a,b){ return b.w-a.w || b.p-a.p; });
    for(var s=0;s<n && s<spots;s++) made[teams[order[s].i].rid]++;
    if(order.length) top[teams[order[0].i].rid]++;
  }

  return teams.map(function(t){
    return { rid:t.rid, playoffs:made[t.rid]/runs, topSeed:top[t.rid]/runs };
  });
}

/* Replay every team's scores against every other team's slate. */
function scheduleSwap(scoresByWeek, schedules){
  // scoresByWeek: {week: {rid: points}}
  // schedules:    {week: {rid: opponentRid}}
  var weeks = Object.keys(schedules).filter(function(w){ return scoresByWeek[w]; });
  var rids = [];
  weeks.forEach(function(w){
    Object.keys(schedules[w]).forEach(function(r){
      if(rids.indexOf(Number(r))<0) rids.push(Number(r));
    });
  });

  var out = {};
  rids.forEach(function(me){
    out[me] = {};
    rids.forEach(function(owner){
      var w=0,l=0,t=0;
      weeks.forEach(function(wk){
        var myScore = scoresByWeek[wk][me];
        if(myScore==null) return;
        var opp = schedules[wk][owner];
        if(opp==null) return;
        if(opp===me) opp = owner;          // would have played yourself, use them
        if(opp===me) return;
        var oppScore = scoresByWeek[wk][opp];
        if(oppScore==null) return;
        if(myScore>oppScore) w++; else if(myScore<oppScore) l++; else t++;
      });
      out[me][owner]={w:w,l:l,t:t};
    });
  });
  return out;
}

/* How many of each position the league starts in total. Flex slots are
   split across their eligible positions in proportion to dedicated slots. */
function positionalDemand(rosterPositions, teams){
  var base={}, flex=[];
  (rosterPositions||[]).forEach(function(s){
    if(BENCH_SLOTS[s]) return;
    var elig = SLOT_ELIGIBILITY[s] || [s];
    if(elig.length===1) base[elig[0]] = (base[elig[0]]||0)+1;
    else flex.push(elig);
  });
  var snap={};
  Object.keys(base).forEach(function(p){ snap[p]=base[p]; });
  flex.forEach(function(elig){
    var total=0;
    elig.forEach(function(p){ total += snap[p]||0; });
    elig.forEach(function(p){
      base[p] = (base[p]||0) + (total ? (snap[p]||0)/total : 1/elig.length);
    });
  });
  var demand={};
  Object.keys(base).forEach(function(p){ demand[p] = base[p]*(teams||12); });
  return demand;
}

/* Draft value.

   The honest way to compare a quarterback to a running back is not talent
   ranking, it is points above the worst starter you could have had instead.
   In a one-QB league the twelfth quarterback is nearly as good as the first,
   so QB1 is worth little over replacement; the same is not true at running
   back. Kickers land at essentially zero by construction.

   Projected points drive this when they are available. Without them we fall
   back to ranking players within their own position, which still removes the
   fake bonus every team gets for waiting on quarterback, but cannot tell you
   that a kicker in round two was a crime. */
function gradeDraft(picks, players, rosterPositions, projections, teams){
  var demand = positionalDemand(rosterPositions, teams);

  var slots={}, flexSlots=[];
  (rosterPositions||[]).forEach(function(s){
    if(BENCH_SLOTS[s]) return;
    var elig = SLOT_ELIGIBILITY[s] || [s];
    if(elig.length===1) slots[elig[0]] = (slots[elig[0]]||0)+1;
    else flexSlots.push(elig);
  });
  function depthFor(pos){
    var d = slots[pos]||0;
    flexSlots.forEach(function(e){ if(e.indexOf(pos)>=0) d++; });
    return d||1;
  }

  function infoFor(p){
    var pl = players && players[p.player_id];
    var rank = pl && pl.search_rank!=null ? Number(pl.search_rank) : null;
    if(rank!=null && !isFinite(rank)) rank = null;
    var pos = (pl && pl.position) || (p.metadata && p.metadata.position) || "?";
    var age = pl && pl.age ? Number(pl.age) : null;
    var proj = projections && projections[p.player_id]!=null ? Number(projections[p.player_id]) : null;
    if(proj!=null && !isFinite(proj)) proj = null;
    return {rank:rank, pos:pos, age:age, proj:proj};
  }

  // Group the drafted pool by position.
  var byPos={}, haveProj=0, total=0;
  picks.forEach(function(p){
    var info = infoFor(p);
    if(info.pos==="?") return;
    total++;
    if(info.proj!=null) haveProj++;
    (byPos[info.pos] = byPos[info.pos] || []).push({pick:p.pick_no, info:info});
  });
  var useProj = total>0 && haveProj/total >= 0.6;

  var expected = {}, vorpOf = {};

  if(useProj){
    // Replacement level is the last startable body at each position.
    var board = [];
    Object.keys(byPos).forEach(function(pos){
      var list = byPos[pos].filter(function(x){ return x.info.proj!=null; })
        .sort(function(a,b){ return b.info.proj-a.info.proj; });
      if(!list.length) return;
      var idx = Math.max(0, Math.min(list.length-1, Math.round(demand[pos]||list.length)));
      var repl = list[idx] ? list[idx].info.proj : list[list.length-1].info.proj;
      list.forEach(function(x){
        var v = x.info.proj - repl;
        vorpOf[x.pick] = v;
        board.push({pick:x.pick, v:v});
      });
    });
    var used = board.map(function(x){ return x.pick; }).sort(function(a,b){ return a-b; });
    board.sort(function(a,b){ return b.v-a.v; });
    board.forEach(function(x,i){ expected[x.pick] = used[i]; });
  } else {
    Object.keys(byPos).forEach(function(pos){
      var list = byPos[pos].filter(function(x){ return x.info.rank!=null; });
      if(!list.length) return;
      var used = list.map(function(x){ return x.pick; }).sort(function(a,b){ return a-b; });
      list.slice().sort(function(a,b){ return a.info.rank-b.info.rank; })
        .forEach(function(x,i){ expected[x.pick] = used[i]; });
    });
  }

  var byRoster = {};
  picks.forEach(function(p){
    var rid = p.roster_id;
    if(rid==null) return;
    if(!byRoster[rid]) byRoster[rid] = {rid:rid, picks:[], ages:[], positions:{}};
    var slot = byRoster[rid], info = infoFor(p);
    slot.positions[info.pos] = (slot.positions[info.pos]||0)+1;
    if(info.age) slot.ages.push(info.age);

    var value = null, exp = expected[p.pick_no];
    if(exp!=null){
      value = p.pick_no - exp;
      if(value >  75) value =  75;
      if(value < -75) value = -75;
    }
    slot.picks.push({pid:p.player_id, pick:p.pick_no, round:p.round, pos:info.pos,
                     rank:info.rank, proj:info.proj, vorp:vorpOf[p.pick_no]!=null?vorpOf[p.pick_no]:null,
                     expected:exp, value:value});
  });

  var rows = Object.keys(byRoster).map(function(k){
    var s = byRoster[k];

    // Who on this roster is plausibly a starter at their own position.
    var seen = {};
    s.picks.slice().sort(function(a,b){
      if(useProj) return (b.proj==null?-1e9:b.proj) - (a.proj==null?-1e9:a.proj);
      return (a.rank==null?1e9:a.rank) - (b.rank==null?1e9:b.rank);
    }).forEach(function(p){
      var n = (seen[p.pos] = (seen[p.pos]||0)+1);
      p.starter = n <= depthFor(p.pos);
      p.weight = p.starter ? 1 : 0.35;
    });

    var wv=0, wt=0;
    s.picks.forEach(function(p){
      if(p.value==null) return;
      wv += p.value*p.weight;
      wt += p.weight;
    });
    s.value = wv;
    s.counted = s.picks.filter(function(p){ return p.value!=null; }).length;
    s.avgValue = wt ? wv/wt : 0;
    s.avgAge = s.ages.length ? s.ages.reduce(function(t,v){return t+v;},0)/s.ages.length : null;
    s.basis = useProj ? "projection" : "rank";
    s.picks.sort(function(a,b){ return a.pick-b.pick; });

    var scored = s.picks.filter(function(p){ return p.value!=null && p.starter; });
    if(!scored.length) scored = s.picks.filter(function(p){ return p.value!=null; });
    s.best  = scored.slice().sort(function(a,b){ return b.value-a.value; })[0] || null;
    s.worst = scored.slice().sort(function(a,b){ return a.value-b.value; })[0] || null;
    return s;
  });
  rows.sort(function(a,b){ return b.avgValue-a.avgValue; });
  return rows;
}

function boot(){
  var state;
  var newsSrc = NEWS_URL + (NEWS_URL.indexOf("?")<0?"?":"&") + "t=" + Date.now();
  fetch(newsSrc,{cache:"no-store"})
    .then(function(r){ return r.ok?r.json():null; })
    .catch(function(){ return null; })
    .then(function(n){ S.news=n; loadArchive().then(function(){ renderNews(); }); return get("/state/nfl"); })
    .then(function(st){
      state=st||{};
      return Promise.all([
        get("/league/"+LEAGUE_ID),
        get("/league/"+LEAGUE_ID+"/users"),
        get("/league/"+LEAGUE_ID+"/rosters")
      ]);
    })
    .then(function(res){
      S.league=res[0]||{};
      (res[1]||[]).forEach(function(u){ S.users[u.user_id]=u; });
      S.rosters=res[2]||[];

      var wk=Number(state.display_week||state.week||1)||1;
      if(String(S.league.season)!==String(state.season)) wk=1;
      S.week=Math.max(1,Math.min(wk,18));
      S.lastWeek=S.week;

      S.finalWeek=0;
      S.rosters.forEach(function(r){
        var st2=r.settings||{};
        var g=(Number(st2.wins)||0)+(Number(st2.losses)||0)+(Number(st2.ties)||0);
        if(g>S.finalWeek) S.finalWeek=g;
      });
      if(S.finalWeek>S.lastWeek) S.finalWeek=S.lastWeek;

      paintMasthead();

      // Pull the whole regular season, not just weeks played. Future weeks
      // come back with the schedule set and zero points, which is exactly
      // what the playoff simulation needs.
      var ps=(S.league.settings&&S.league.settings.playoff_week_start)||15;
      S.regWeeks=Math.max(1,Math.min(ps-1,18));

      var allWeeks=[],txWeeks=[],w;
      for(w=1;w<=S.regWeeks;w++) allWeeks.push(w);
      for(w=1;w<=S.lastWeek;w++) txWeeks.push(w);

      return Promise.all([
        Promise.all(allWeeks.map(function(w){ return get("/league/"+LEAGUE_ID+"/matchups/"+w).catch(function(){return [];}); })),
        Promise.all(txWeeks.map(function(w){ return get("/league/"+LEAGUE_ID+"/transactions/"+w).catch(function(){return [];}); })),
        get("/league/"+LEAGUE_ID+"/drafts").catch(function(){return [];})
      ]).then(function(out){
        allWeeks.forEach(function(w,i){ S.matchups[w]=out[0][i]||[]; });
        var tx=[];
        txWeeks.forEach(function(w,i){ (out[1][i]||[]).forEach(function(t){ t._week=w; tx.push(t); }); });
        tx.sort(function(a,b){ return (b.status_updated||0)-(a.status_updated||0); });
        S.transactions=tx;
        S.claims=buildClaims();

        var drafts=out[2]||[];
        if(drafts.length && drafts[0].draft_id){
          return get("/draft/"+drafts[0].draft_id+"/picks")
            .then(function(p){ S.draftPicks=p||[]; })
            .catch(function(){ S.draftPicks=[]; });
        }
        S.draftPicks=[];
      });
    })
    .then(function(){
      renderNews(); renderWeek(); renderStandings(); renderPower();
      renderDraft(); renderMoves();
      loadPlayers();
    })
    .catch(function(e){ fail(e.message||String(e)); });
}

function paintMasthead(){
  $("leagueName").textContent=S.league.name||"Sigma Pi B";
  var bits=[S.league.season+" season",(S.rosters.length||12)+" teams"];
  if(S.league.scoring_settings&&S.league.scoring_settings.rec) bits.push("PPR");
  $("leagueSub").textContent=bits.join(", ");
  var ps=(S.league.settings&&S.league.settings.playoff_week_start)||15;
  $("clock").textContent=(S.week>=ps?"Playoffs, week ":"Week ")+S.week;
}

/* ============================================================
   ANALYSIS — every number the newsroom is allowed to use
   ============================================================ */
function weeklyScores(){
  var byRoster={};
  S.rosters.forEach(function(r){ byRoster[r.roster_id]=[]; });
  Object.keys(S.matchups).forEach(function(w){
    if(Number(w)>S.finalWeek) return;
    var played=(S.matchups[w]||[]).some(function(m){ return (Number(m.points)||0)>0; });
    if(!played) return;
    (S.matchups[w]||[]).forEach(function(m){
      if(byRoster[m.roster_id]) byRoster[m.roster_id].push({week:Number(w),points:Number(m.points)||0});
    });
  });
  Object.keys(byRoster).forEach(function(k){ byRoster[k].sort(function(a,b){return a.week-b.week;}); });
  return byRoster;
}

function allPlay(){
  var scores=weeklyScores(),out={},weeks={};
  S.rosters.forEach(function(r){ out[r.roster_id]={w:0,l:0,games:0}; });
  Object.keys(scores).forEach(function(rid){
    scores[rid].forEach(function(s){ (weeks[s.week]=weeks[s.week]||[]).push({rid:Number(rid),p:s.points}); });
  });
  Object.keys(weeks).forEach(function(w){
    var list=weeks[w];
    list.forEach(function(me){
      list.forEach(function(o){
        if(me.rid===o.rid) return;
        out[me.rid].games++;
        if(me.p>o.p) out[me.rid].w++; else if(me.p<o.p) out[me.rid].l++;
      });
    });
  });
  return out;
}

/* Points that sat on the bench, per team, for a given week. */
function benchPoints(week){
  var out={};
  (S.matchups[week]||[]).forEach(function(m){
    var starters={},total=0;
    (m.starters||[]).forEach(function(p){ starters[p]=1; });
    var pp=m.players_points||{};
    Object.keys(pp).forEach(function(pid){ if(!starters[pid]) total+=Number(pp[pid])||0; });
    out[m.roster_id]={points:total, best:bestBench(pp,starters)};
  });
  return out;
}
function bestBench(pp,starters){
  var top=null;
  Object.keys(pp).forEach(function(pid){
    if(starters[pid]) return;
    var v=Number(pp[pid])||0;
    if(!top||v>top.points) top={pid:pid,points:v};
  });
  return top;
}

/* Pair up matchups for a week: [{a,b,margin}] */
function games(week){
  var g={},out=[];
  (S.matchups[week]||[]).forEach(function(m){
    if(m.matchup_id==null) return;
    (g[m.matchup_id]=g[m.matchup_id]||[]).push(m);
  });
  Object.keys(g).forEach(function(k){
    var p=g[k]; if(p.length<2) return;
    var a=p[0],b=p[1];
    var pa=Number(a.points)||0, pb=Number(b.points)||0;
    out.push({
      win: pa>=pb?a:b, lose: pa>=pb?b:a,
      winPts: Math.max(pa,pb), losePts: Math.min(pa,pb),
      margin: Math.abs(pa-pb)
    });
  });
  return out;
}

function buildClaims(){
  var map={},out=[];
  S.transactions.forEach(function(t){
    if(t.type!=="waiver"||!t.adds) return;
    Object.keys(t.adds).forEach(function(pid){
      var key=t._week+":"+pid;
      var c=map[key];
      if(!c){ c=map[key]={week:t._week,pid:pid,bids:[],when:t.status_updated}; out.push(c); }
      c.bids.push({
        roster:(t.roster_ids&&t.roster_ids[0])||t.adds[pid],
        amount:(t.settings&&t.settings.waiver_bid)||0,
        won:t.status==="complete",
        drops:t.drops||null
      });
      if((t.status_updated||0)>(c.when||0)) c.when=t.status_updated;
    });
  });
  out.forEach(function(c){ c.bids.sort(function(a,b){return b.amount-a.amount;}); });
  out.sort(function(a,b){ return (b.when||0)-(a.when||0); });
  return out;
}

/* ============================================================
   THE WIRE — takes the page writes by itself, no AI involved
   ============================================================ */
/* Before any games exist, the only real numbers are the projections. */
function preseasonWire(){
  var items=[];
  var strength=projectedStrength();
  if(!strength) return items;

  var rows=S.rosters.map(function(r){
    return {rid:r.roster_id, p:strength[r.roster_id]};
  }).filter(function(x){ return x.p!=null; })
    .sort(function(a,b){ return b.p-a.p; });
  if(rows.length<3) return items;

  var top=rows[0], bot=rows[rows.length-1];
  var spread=top.p-bot.p;
  var median=rows[Math.floor(rows.length/2)].p;

  items.push({
    tag:"Preseason",
    hl:esc(teamName(top.rid))+" has the best roster in the league on paper, projected for "+num(top.p,1)+" a week",
    dt:"That is "+num(top.p-median,1)+" points a week clear of the median team. Paper is undefeated in September."
  });

  items.push({
    tag:"Preseason",
    hl:esc(teamName(bot.rid))+" projects last at "+num(bot.p,1)+" a week",
    dt:num(spread,1)+" points a week separates first from last. Over a full season that is a landslide or a rounding error, depending on who you ask."
  });

  var within=rows.filter(function(r){ return top.p-r.p<=8; }).length;
  if(within>=3){
    items.push({
      tag:"Logjam",
      hl:within+" teams project within 8 points a week of each other at the top",
      dt:"Which is to say the projections cannot tell them apart, and neither can anyone else."
    });
  }

  var second=rows[1];
  if(top.p-second.p>=6){
    items.push({
      tag:"Gap",
      hl:esc(teamName(top.rid))+" projects "+num(top.p-second.p,1)+" points a week ahead of second place",
      dt:esc(teamName(second.rid))+" is the closest thing to competition, and it is not especially close."
    });
  }

  // Cross-reference the draft: did the projections agree with the draft grade?
  if(S.draftPicks&&S.draftPicks.length&&S.players){
    var dr=gradeDraft(S.draftPicks,S.players,(S.league&&S.league.roster_positions)||[],S.projections,S.rosters.length);
    if(dr.length){
      var bestDraft=dr[0];
      var projRank={};
      rows.forEach(function(r,i){ projRank[r.rid]=i+1; });
      var pr=projRank[bestDraft.rid];
      if(pr){
        items.push({
          tag:"Draft check",
          hl:esc(teamName(bestDraft.rid))+" drafted the best value in the league and projects "+ordinal(pr),
          dt:"Value per pick of "+(bestDraft.avgValue>0?"+":"")+num(bestDraft.avgValue,1)
            +(pr<=3?". The draft board and the projections agree for once."
                   :". Getting value and having the best roster are apparently different things.")
        });
      }
    }
  }

  return items;
}
function ordinal(n){
  var s=["th","st","nd","rd"], v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}

function buildWire(){
  var items=[], wk=S.finalWeek;
  if(!wk) return preseasonWire();

  var gs=games(wk), bench=benchPoints(wk), ap=allPlay(), scores=weeklyScores();

  // Everyone's score this week, ranked.
  var week=[];
  (S.matchups[wk]||[]).forEach(function(m){ week.push({rid:m.roster_id,p:Number(m.points)||0}); });
  week.sort(function(a,b){ return b.p-a.p; });

  // 1. Highest-scoring loser
  var hiLoser=null;
  gs.forEach(function(g){ if(!hiLoser||g.losePts>hiLoser.losePts) hiLoser=g; });
  if(hiLoser){
    var beatCount=week.filter(function(x){ return x.p<hiLoser.losePts; }).length;
    items.push({
      tag:"Week "+wk,
      hl:esc(teamName(hiLoser.lose.roster_id))+" scored enough to beat "+beatCount+" of "+(week.length-1)+" teams and lost anyway",
      dt:num(hiLoser.losePts)+" points, into a "+num(hiLoser.winPts)+" buzzsaw from "+esc(teamName(hiLoser.win.roster_id))+"."
    });
  }

  // 2. Lowest-scoring winner
  var loWinner=null;
  gs.forEach(function(g){ if(!loWinner||g.winPts<loWinner.winPts) loWinner=g; });
  if(loWinner && (!hiLoser || loWinner.win.roster_id!==hiLoser.win.roster_id)){
    var lostToCount=week.filter(function(x){ return x.p>loWinner.winPts; }).length;
    items.push({
      tag:"Schedule luck",
      hl:esc(teamName(loWinner.win.roster_id))+" won with "+num(loWinner.winPts)+" and "+lostToCount+" teams outscored them",
      dt:"A win is a win. It is also, in this case, a coincidence."
    });
  }

  // 3. Biggest bench crime
  var worst=null;
  Object.keys(bench).forEach(function(rid){
    var b=bench[rid];
    if(b.best && (!worst||b.best.points>worst.best.points)) worst={rid:Number(rid),best:b.best,points:b.points};
  });
  if(worst && worst.best.points>12){
    items.push({
      tag:"Bench",
      hl:esc(teamName(worst.rid))+" left "+num(worst.best.points,1)+" points sitting on the bench",
      dt:esc(playerName(worst.best.pid))+" put that up in street clothes. Total bench output: "+num(worst.points,1)+"."
    });
  }

  // 4. Blowout and nailbiter
  var blow=null,close=null;
  gs.forEach(function(g){
    if(!blow||g.margin>blow.margin) blow=g;
    if(!close||g.margin<close.margin) close=g;
  });
  if(blow && blow.margin>30){
    items.push({
      tag:"Blowout",
      hl:esc(teamName(blow.win.roster_id))+" beat "+esc(teamName(blow.lose.roster_id))+" by "+num(blow.margin,1),
      dt:num(blow.winPts)+" to "+num(blow.losePts)+". Not a game so much as an errand."
    });
  }
  if(close && close.margin<6 && (!blow||close!==blow)){
    items.push({
      tag:"Nailbiter",
      hl:num(close.margin,2)+" points decided "+esc(teamName(close.win.roster_id))+" over "+esc(teamName(close.lose.roster_id)),
      dt:"Somewhere in there, one flex decision was worth the whole week."
    });
  }

  // 5. Season-long luck
  var luck=S.rosters.map(function(r){
    var st=r.settings||{}, w=Number(st.wins)||0;
    var g=w+(Number(st.losses)||0)+(Number(st.ties)||0);
    var a=ap[r.roster_id]||{w:0,games:0};
    var pct=a.games?a.w/a.games:0;
    return {rid:r.roster_id, luck:w-pct*g, w:w, exp:pct*g};
  }).sort(function(a,b){ return b.luck-a.luck; });
  if(luck.length>1 && S.finalWeek>=3){
    var top=luck[0], bot=luck[luck.length-1];
    if(top.luck>1){
      items.push({
        tag:"Fraud watch",
        hl:esc(teamName(top.rid))+" is "+num(top.luck,1)+" wins ahead of what they have earned",
        dt:"Record says "+top.w+" wins. The scores say "+num(top.exp,1)+"."
      });
    }
    if(bot.luck<-1){
      items.push({
        tag:"Robbery",
        hl:esc(teamName(bot.rid))+" is "+num(Math.abs(bot.luck),1)+" wins short of what they have earned",
        dt:"Record says "+bot.w+" wins. The scores say "+num(bot.exp,1)+"."
      });
    }
  }

  // 6. Biggest overpay on waivers
  var contested=S.claims.filter(function(c){ return c.bids.length>1 && c.bids[0].won; });
  if(contested.length){
    var gapMax=null;
    contested.forEach(function(c){
      var gap=c.bids[0].amount-c.bids[1].amount;
      if(!gapMax||gap>gapMax.gap) gapMax={c:c,gap:gap};
    });
    if(gapMax && gapMax.gap>0){
      var c=gapMax.c;
      items.push({
        tag:"FAAB",
        hl:esc(teamName(c.bids[0].roster))+" paid $"+c.bids[0].amount+" for "+esc(playerName(c.pid))+" when $"+(c.bids[1].amount+1)+" would have done it",
        dt:"Beat the next bid by $"+gapMax.gap+", with "+c.bids.length+" teams in on it."
      });
    }
  }

  // 6b. Worst lineup management
  if(S.eff){
    var effRows=S.rosters.map(function(r){
      var e=S.eff[r.roster_id];
      return e&&e.pct!=null?{rid:r.roster_id,pct:e.pct,lost:e.lost}:null;
    }).filter(Boolean).sort(function(a,b){ return a.pct-b.pct; });
    if(effRows.length && effRows[0].pct<0.92){
      items.push({
        tag:"Mismanagement",
        hl:esc(teamName(effRows[0].rid))+" is starting only "+Math.round(effRows[0].pct*100)+"% of the points they roster",
        dt:num(effRows[0].lost,1)+" points have been left unstarted this season. The players were right there."
      });
    }
  }

  // 7. Broke
  var budget=(S.league.settings&&S.league.settings.waiver_budget)||100;
  var broke=S.rosters.map(function(r){
    return {rid:r.roster_id, left:budget-(Number((r.settings||{}).waiver_budget_used)||0)};
  }).sort(function(a,b){ return a.left-b.left; })[0];
  if(broke && broke.left<=budget*0.15){
    items.push({
      tag:"FAAB",
      hl:esc(teamName(broke.rid))+" has $"+broke.left+" left for the rest of the season",
      dt:"Every injury from here is a personal problem."
    });
  }

  return items;
}

/* ============================================================
   RECEIPTS — every ballot ever cast, checked against reality
   ============================================================ */
function receiptsHTML(){
  var polls = [];
  allEditions().forEach(function(ed){
    if(ed && ed.poll && ed.poll.ballots && ed.poll.ballots.length){
      polls.push({poll:ed.poll, week:ed.week, generated:ed.generated});
    }
  });
  if(!polls.length) return "";

  var actual = actualRankMap();
  if(!actual){
    return '<h2 style="margin-top:34px">Poll receipts</h2>'
      + '<div class="msg">Every ballot above is on the record. The moment week 1 goes final, '
      + 'each one gets scored against the actual standings and nobody gets to quietly revise it.</div>';
  }

  var h = '<h2 style="margin-top:34px">Poll receipts</h2>'
    + '<p class="note">Each ballot scored against the standings as they stand after week ' + S.finalWeek + '. '
    + 'Pairwise accuracy is the share of all team pairs a desk put in the right order. '
    + 'Nobody submits these twice.</p>';

  polls.slice(-3).reverse().forEach(function(entry){
    var rows = [];
    entry.poll.ballots.forEach(function(b){
      var a = ANALYSTS[b.analyst];
      if(!a || !b.ranking || !b.ranking.length) return;
      var ids = b.ranking.map(function(nm){ return resolveTeam(nm); }).filter(function(x){ return x!=null; });
      var sc = scoreRanking(ids, actual);
      if(sc) rows.push({key:b.analyst, meta:a, sc:sc});
    });
    if(!rows.length) return;
    rows.sort(function(x,y){ return y.sc.pairwise-x.sc.pairwise || x.sc.mae-y.sc.mae; });

    h += '<div class="poll-wrap"><div class="season-head"><h3>'
      + esc(entry.poll.title || "Poll") + '</h3>'
      + '<span class="champ">' + (entry.week!=null ? 'submitted week ' + entry.week : '') + '</span></div>'
      + '<div class="scroll"><table><thead><tr><th></th><th>Desk</th><th>Pairwise</th>'
      + '<th>Avg spots off</th><th>Their pick to win</th><th>Biggest miss</th></tr></thead><tbody>';

    rows.forEach(function(r,i){
      var s = r.sc;
      var cls = s.pairwise>=0.7?"pos":(s.pairwise<=0.4?"neg":"");
      var topName = s.top.id!=null ? teamName(s.top.id) : "--";
      var worstName = s.worst && s.worst.id!=null ? teamName(s.worst.id) : "--";
      h += '<tr class="rank-'+(i+1)+'"><td>'+(i+1)+'</td>'
        + '<td><div class="team-cell"><div class="tname" style="color:'+r.meta.color+'">'+esc(r.meta.name)+'</div>'
        + '<div class="mgr">'+esc(r.meta.role)+'</div></div></td>'
        + '<td class="'+cls+'">'+Math.round(s.pairwise*100)+'%</td>'
        + '<td>'+num(s.mae,1)+'</td>'
        + '<td>'+esc(topName)+'<div class="mgr">actually '+ordinal(s.top.actual)+'</div></td>'
        + '<td>'+esc(worstName)+'<div class="mgr">had them '+ordinal(s.worst.predicted)
        + ', actually '+ordinal(s.worst.actual)+'</div></td></tr>';
    });
    h += '</tbody></table></div></div>';
  });
  return h;
}

/* ============================================================
   THE POLL
   Analysts submit ballots in news.json. The page does the counting,
   which keeps the opinions opinionated and the arithmetic honest.
   ============================================================ */
function resolveTeam(name){
  var n=String(name||"").trim().toLowerCase();
  if(!n) return null;
  var i, rid;
  for(i=0;i<S.rosters.length;i++){
    rid=S.rosters[i].roster_id;
    if(teamName(rid).trim().toLowerCase()===n) return rid;
  }
  for(i=0;i<S.rosters.length;i++){
    rid=S.rosters[i].roster_id;
    if(String(manager(rid)).trim().toLowerCase()===n) return rid;
  }
  // Curly apostrophes, emoji and stray punctuation should never decide this.
  var k=normKey(n);
  if(k){
    for(i=0;i<S.rosters.length;i++){
      rid=S.rosters[i].roster_id;
      if(normKey(teamName(rid))===k) return rid;
    }
    for(i=0;i<S.rosters.length;i++){
      rid=S.rosters[i].roster_id;
      var tk=normKey(teamName(rid));
      if(tk&&(tk.indexOf(k)===0||k.indexOf(tk)===0)) return rid;
    }
  }
  for(i=0;i<S.rosters.length;i++){
    rid=S.rosters[i].roster_id;
    var t=teamName(rid).trim().toLowerCase();
    if(t.indexOf(n)===0||n.indexOf(t)===0) return rid;
  }
  return null;
}
function normKey(s){
  return String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]/g,"");
}

function pollHTML(){
  var poll=S.news&&S.news.poll;
  if(!poll||!poll.ballots||!poll.ballots.length) return "";

  var voters=[], tally={}, unresolved=[];
  poll.ballots.forEach(function(b){
    var order=b.ranking||[];
    if(!order.length) return;
    var a=ANALYSTS[b.analyst]||{name:b.analyst||"Anonymous",role:"",color:"var(--dim)"};
    voters.push({key:b.analyst, meta:a, comment:b.comment||""});
    order.forEach(function(nm,i){
      var rid=resolveTeam(nm);
      if(rid==null){ if(unresolved.indexOf(nm)<0) unresolved.push(nm); return; }
      if(!tally[rid]) tally[rid]={rid:rid, points:0, firsts:0, ranks:{}};
      tally[rid].points += (order.length - i);
      if(i===0) tally[rid].firsts++;
      tally[rid].ranks[b.analyst] = i+1;
    });
  });
  if(!voters.length) return "";

  var rows=Object.keys(tally).map(function(k){ return tally[k]; })
    .sort(function(a,b){ return b.points-a.points||b.firsts-a.firsts; });
  if(!rows.length) return "";

  var h='<h2>'+esc(poll.title||"The poll")+'</h2>'
    +'<p class="note">'
    +esc(poll.note||("Each desk submits a full ballot. First place is worth "+S.rosters.length+" points down to 1, exactly like the college football polls. The page counts the votes."))
    +'</p>';

  h+='<div class="scroll"><table><thead><tr><th></th><th>Team</th><th>Points</th><th>First</th>';
  voters.forEach(function(v){
    var short=v.meta.name.split(" ").slice(-1)[0];
    h+='<th>'+esc(short)+'</th>';
  });
  h+='<th>Spread</th></tr></thead><tbody>';

  rows.forEach(function(r,i){
    h+='<tr class="rank-'+(i+1)+'"><td>'+(i+1)+'</td><td>'+teamCell(r.rid)+'</td>'
      +'<td>'+r.points+'</td><td>'+(r.firsts||'')+'</td>';
    var vals=[];
    voters.forEach(function(v){
      var rk=r.ranks[v.key];
      if(rk) vals.push(rk);
      h+='<td>'+(rk||'--')+'</td>';
    });
    var spread=vals.length>1?Math.max.apply(null,vals)-Math.min.apply(null,vals):0;
    h+='<td class="'+(spread>=5?"neg":"")+'">'+(spread||'')+'</td></tr>';
  });
  h+='</tbody></table></div>';

  // Where the room disagrees most.
  var arg=rows.slice().map(function(r){
    var vals=[];
    voters.forEach(function(v){ if(r.ranks[v.key]) vals.push({k:v.key,r:r.ranks[v.key]}); });
    if(vals.length<2) return null;
    vals.sort(function(a,b){ return a.r-b.r; });
    return {rid:r.rid, low:vals[0], high:vals[vals.length-1], spread:vals[vals.length-1].r-vals[0].r};
  }).filter(Boolean).sort(function(a,b){ return b.spread-a.spread; })[0];

  if(arg&&arg.spread>=3){
    var hiName=(ANALYSTS[arg.low.k]||{}).name||arg.low.k;
    var loName=(ANALYSTS[arg.high.k]||{}).name||arg.high.k;
    h+='<div class="wire" style="margin-top:14px"><div class="wire-item">'
      +'<div class="hl"><span class="tag">Split</span>'+esc(teamName(arg.rid))
      +' is the biggest argument in the room</div>'
      +'<div class="dt">'+esc(hiName)+' has them '+ordinal(arg.low.r)+'. '
      +esc(loName)+' has them '+ordinal(arg.high.r)+'. '+arg.spread+' spots apart.</div></div></div>';
  }

  if(voters.some(function(v){ return v.comment; })){
    h+='<div class="takes" style="margin-top:18px;border-top:none;padding-top:0">';
    voters.forEach(function(v){
      if(!v.comment) return;
      var initials=v.meta.name.replace(/^The\s+/i,"").slice(0,2);
      h+='<div class="take">'
        +'<div class="face" style="background:'+v.meta.color+'">'+esc(initials)+'</div>'
        +'<div class="body"><div class="who">'+esc(v.meta.name)
        +(v.meta.role?'<span class="role">'+esc(v.meta.role)+'</span>':'')+'</div>'
        +'<div class="txt">'+esc(v.comment)+'</div></div></div>';
    });
    h+='</div>';
  }

  if(unresolved.length){
    h+='<p class="note" style="margin-top:12px">Not matched to a team: '+esc(unresolved.join(", "))+'</p>';
  }
  return h+'<div style="height:34px"></div>';
}

function renderNews(){
  var html='<h2>The wire</h2>'
    +'<p class="note">'
    +(S.finalWeek
      ? 'Written by the page itself from this week&rsquo;s actual numbers. Always current, never wrong, no opinions it cannot back up.'
      : 'Written by the page itself. Nothing has been played, so everything here comes from the projections.')
    +'</p>';

  var wire=buildWire();
  if(wire.length){
    html+='<div class="wire">';
    wire.forEach(function(i){
      html+='<div class="wire-item"><div class="hl"><span class="tag">'+esc(i.tag)+'</span>'+i.hl+'</div>'
        +'<div class="dt">'+i.dt+'</div></div>';
    });
    html+='</div>';
  } else {
    html+='<div class="msg" style="margin-bottom:34px">Nothing to report yet. The wire fills in as soon as a week goes final.</div>';
  }

  html+=pollHTML();
  html+=receiptsHTML();

  html+='<h2>The desk</h2>'
    +'<p class="note">Analysis, argument, and the occasional grudge.</p>';

  var stories=(S.news&&S.news.stories)||[];
  if(stories.length){
    html+=tocHTML(stories);
    stories.forEach(function(st,i){ html+=storyHTML(st,i); });
  } else {
    html+='<div class="msg">No stories filed yet this week. The wire above never sleeps.</div>';
  }

  // The briefing tools only exist for whoever knows to add ?desk to the URL.
  if(DESK){
    html+='<div class="bar">'
      +'<button class="btn" id="copyBriefing">Copy this week&rsquo;s briefing</button>'
      +'<span class="hint">Only visible because this URL ends in ?desk. Nobody else sees this.</span>'
      +'</div>';
  }

  $("tab-news").innerHTML=html;

  Array.prototype.forEach.call(document.querySelectorAll(".toc-item"), function(el){
    el.addEventListener("click", function(){
      var target=$("story-"+el.dataset.story);
      if(!target) return;
      var reduce=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      try { target.scrollIntoView({behavior:reduce?"auto":"smooth", block:"start"}); }
      catch(e){ target.scrollIntoView(); }
    });
  });

  var b=$("copyBriefing");
  if(b) b.addEventListener("click",copyBriefing);
}

/* A wire-style index of what is on the desk, so the front page reads like
   a front page instead of a scroll. */
function tocHTML(stories){
  if(!stories || stories.length < 2) return "";
  var h='<div class="wire toc">';
  stories.forEach(function(st,i){
    var body=String(st.body||"").trim();
    var first=body.split(/(?<=[.!?])\s/)[0] || "";
    if(first.length>150) first=first.slice(0,147).replace(/\s+\S*$/,"")+"...";
    h+='<button type="button" class="wire-item toc-item" data-story="'+i+'">'
      +'<span class="hl"><span class="tag">'+(i+1)+'</span>'+esc(st.headline||"Untitled")+'</span>'
      +(first?'<span class="dt">'+esc(first)+'</span>':'')
      +'</button>';
  });
  return h+'</div>';
}

function storyHTML(st,i){
  var h='<article class="story" id="story-'+i+'">';
  if(st.sample) h+='<div class="sample">Sample story.</div>';
  h+='<h3>'+esc(st.headline||"Untitled")+'</h3>';
  String(st.body||"").split(/\n\s*\n/).forEach(function(p){
    if(p.trim()) h+='<p>'+esc(p.trim())+'</p>';
  });
  if(st.takes&&st.takes.length){
    h+='<div class="takes">';
    st.takes.forEach(function(t){
      var a=ANALYSTS[t.analyst]||{name:t.analyst||"Anonymous",role:"",color:"var(--dim)"};
      var initials=a.name.replace(/^The\s+/i,"").slice(0,2);
      h+='<div class="take">'
        +'<div class="face" style="background:'+a.color+'">'+esc(initials)+'</div>'
        +'<div class="body"><div class="who">'+esc(a.name)
        +(a.role?'<span class="role">'+esc(a.role)+'</span>':'')+'</div>'
        +'<div class="txt">'+esc(t.text||"")+'</div></div></div>';
    });
    h+='</div>';
  }
  return h+'</article>';
}

/* ============================================================
   BRIEFING — one clipboard dump of every fact the site knows
   ============================================================ */
/* Everything the writer needs to know about what has already been published. */
function editorialContext(){
  var L = [], eds = allEditions();
  if(!eds.length) return "";

  L.push("EDITORIAL CONTEXT");
  if(S.archiveError) L.push("(archive unavailable: " + S.archiveError + ")");

  var prev = eds.slice(-2);
  prev.forEach(function(ed){
    var label = ed.week!=null ? ("WEEK " + ed.week) : "PREVIOUS";
    L.push("");
    L.push(label + " HEADLINES");
    (ed.stories||[]).forEach(function(s){ L.push("- " + s.headline); });
  });

  var last = eds[eds.length-1];
  if(last && last.stories){
    var byAnalyst = {};
    last.stories.forEach(function(s){
      (s.takes||[]).forEach(function(t){
        var a = ANALYSTS[t.analyst];
        if(!a) return;
        (byAnalyst[a.name] = byAnalyst[a.name] || []).push(t.text);
      });
    });
    if(Object.keys(byAnalyst).length){
      L.push("");
      L.push("MOST RECENT ANALYST TAKES (these are on the record and can be judged)");
      Object.keys(byAnalyst).forEach(function(nm){
        L.push(nm + ":");
        byAnalyst[nm].slice(0,4).forEach(function(t){
          L.push("  - " + (t.length>200 ? t.slice(0,197)+"..." : t));
        });
      });
    }
  }

  // Ballots, plus how they are holding up. Capped so the briefing stays pasteable.
  var actual = actualRankMap();
  var polled = eds.filter(function(ed){ return ed.poll && ed.poll.ballots && ed.poll.ballots.length; });
  polled.slice(-2).forEach(function(ed){
    L.push("");
    L.push("BALLOTS ON THE RECORD: " + (ed.poll.title || "poll")
      + (ed.week!=null ? " (week " + ed.week + ")" : ""));
    ed.poll.ballots.forEach(function(b){
      var a = ANALYSTS[b.analyst];
      if(!a || !b.ranking) return;
      L.push(a.name + ": " + b.ranking.join(" > "));
      if(actual){
        var ids = b.ranking.map(function(nm){ return resolveTeam(nm); }).filter(function(x){ return x!=null; });
        var sc = scoreRanking(ids, actual);
        if(sc){
          L.push("  scored so far: " + Math.round(sc.pairwise*100) + "% pairwise, "
            + num(sc.mae,1) + " spots off on average"
            + (sc.worst ? ", worst call " + teamName(sc.worst.id)
                + " (had them " + sc.worst.predicted + ", actually " + sc.worst.actual + ")" : ""));
        }
      }
    });
  });

  var open = [];
  eds.forEach(function(ed){
    (ed.stories||[]).forEach(function(s){
      if(s.storyline) open.push(s.storyline);
    });
  });
  if(open.length){
    L.push("");
    L.push("ONGOING STORYLINES");
    open.forEach(function(s){ L.push("- " + s); });
  }

  L.push("");
  return L.join("\n");
}

function briefingText(){
  var L=[], wk=S.finalWeek||S.week;
  var ap=allPlay(), scores=weeklyScores();
  var budget=(S.league.settings&&S.league.settings.waiver_budget)||100;

  L.push("LEAGUE BRIEFING");
  L.push((S.league.name||"League")+", "+S.league.season+" season, through week "+wk);
  L.push("Teams: "+S.rosters.length+". FAAB budget: $"+budget+".");
  L.push("");

  L.push("STANDINGS (rank, team, manager, record, points for, points against, all-play, expected wins, luck)");
  var rows=S.rosters.map(function(r){
    var st=r.settings||{};
    var w=Number(st.wins)||0,l=Number(st.losses)||0,t=Number(st.ties)||0;
    var a=ap[r.roster_id]||{w:0,l:0,games:0};
    var pct=a.games?a.w/a.games:0;
    return {rid:r.roster_id,w:w,l:l,t:t,
      pf:pts(st.fpts,st.fpts_decimal), pa:pts(st.fpts_against,st.fpts_against_decimal),
      ap:a, exp:pct*(w+l+t), luck:w-pct*(w+l+t)};
  }).sort(function(a,b){ return b.w-a.w||b.pf-a.pf; });
  rows.forEach(function(r,i){
    L.push((i+1)+". "+teamName(r.rid)+" ("+manager(r.rid)+") "+r.w+"-"+r.l+(r.t?"-"+r.t:"")
      +", PF "+num(r.pf)+", PA "+num(r.pa)
      +", all-play "+r.ap.w+"-"+r.ap.l
      +", expected "+num(r.exp,1)+", luck "+(r.luck>0?"+":"")+num(r.luck,1));
  });
  L.push("");

  if(S.finalWeek){
    var bench=benchPoints(S.finalWeek);
    L.push("WEEK "+S.finalWeek+" RESULTS");
    games(S.finalWeek).forEach(function(g){
      L.push(teamName(g.win.roster_id)+" "+num(g.winPts)+" def "+teamName(g.lose.roster_id)+" "+num(g.losePts)
        +" (margin "+num(g.margin)+")");
    });
    L.push("");
    L.push("WEEK "+S.finalWeek+" BENCH POINTS (points left unstarted, best benched player)");
    Object.keys(bench).forEach(function(rid){
      var b=bench[rid];
      L.push(teamName(Number(rid))+": "+num(b.points,1)
        +(b.best?", best bench "+playerName(b.best.pid)+" "+num(b.best.points,1):""));
    });
    L.push("");
  }

  L.push("SCORING BY WEEK");
  S.rosters.forEach(function(r){
    var list=scores[r.roster_id]||[];
    if(!list.length) return;
    L.push(teamName(r.roster_id)+": "+list.map(function(s){ return "wk"+s.week+" "+num(s.points,1); }).join(", "));
  });
  L.push("");

  L.push("FAAB REMAINING");
  S.rosters.map(function(r){
    return {rid:r.roster_id, used:Number((r.settings||{}).waiver_budget_used)||0};
  }).sort(function(a,b){ return a.used-b.used; }).forEach(function(r){
    L.push(teamName(r.rid)+": $"+(budget-r.used)+" left, $"+r.used+" spent");
  });
  L.push("");

  if(S.eff){
    L.push("LINEUP EFFICIENCY (actual points as a share of the best lineup available)");
    S.rosters.map(function(r){
      var e=S.eff[r.roster_id];
      return e&&e.pct!=null?{rid:r.roster_id,pct:e.pct,lost:e.lost}:null;
    }).filter(Boolean).sort(function(a,b){ return b.pct-a.pct; }).forEach(function(r){
      L.push(teamName(r.rid)+": "+Math.round(r.pct*100)+"%, "+num(r.lost,1)+" points left unstarted");
    });
    L.push("");
  }

  var strength=projectedStrength();
  if(strength){
    L.push("PROJECTED WEEKLY SCORE (best lineup each roster could start, week "+S.projWeek+")");
    S.rosters.map(function(r){ return {rid:r.roster_id, p:strength[r.roster_id]}; })
      .filter(function(x){ return x.p!=null; })
      .sort(function(a,b){ return b.p-a.p; })
      .forEach(function(x,i){ L.push((i+1)+". "+teamName(x.rid)+": "+num(x.p,1)); });
    L.push("");
  } else if(S.projError){
    L.push("PROJECTIONS UNAVAILABLE: "+S.projError);
    L.push("");
  }

  var odds=playoffOdds();
  if(odds){
    L.push("PLAYOFF ODDS (5000 simulations, top "+odds.spots+" advance, "+odds.weeksLeft+" weeks left)");
    odds.rows.slice().sort(function(a,b){ return b.playoffs-a.playoffs; }).forEach(function(r){
      L.push(teamName(r.rid)+": "+Math.round(r.playoffs*100)+"% playoffs, "+Math.round(r.topSeed*100)+"% top seed");
    });
    L.push("");
  }

  if(S.draftPicks&&S.draftPicks.length&&S.players){
    var dr=gradeDraft(S.draftPicks,S.players,(S.league&&S.league.roster_positions)||[],S.projections,S.rosters.length);
    if(dr.length){
      L.push("DRAFT VALUE (positive means players fell to them, negative means they reached)");
      dr.forEach(function(r,i){
        L.push((i+1)+". "+teamName(r.rid)+": "+(r.avgValue>0?"+":"")+num(r.avgValue,1)+" per pick"
          +(r.best?", best "+playerName(r.best.pid)+" at pick "+r.best.pick:"")
          +(r.worst?", worst "+playerName(r.worst.pid)+" at pick "+r.worst.pick:"")
          +(r.avgAge?", average age "+num(r.avgAge,1):""));
      });
      L.push("");
    }
  }

  L.push("WAIVER CLAIMS, NEWEST FIRST (winning bid first, then losing bids)");
  S.claims.slice(0,25).forEach(function(c){
    var parts=c.bids.map(function(b){
      return teamName(b.roster)+" $"+b.amount+(b.won?" WON":" lost");
    });
    L.push("Week "+c.week+": "+playerName(c.pid)+(playerMeta(c.pid)?" ("+playerMeta(c.pid)+")":"")
      +" -- "+parts.join("; "));
  });
  L.push("");

  var trades=S.transactions.filter(function(t){ return t.type==="trade"&&t.status==="complete"; });
  if(trades.length){
    L.push("TRADES");
    trades.forEach(function(t){
      var lines=[];
      (t.roster_ids||[]).forEach(function(rid){
        var gets=[];
        if(t.adds) Object.keys(t.adds).forEach(function(pid){ if(t.adds[pid]===rid) gets.push(playerName(pid)); });
        (t.draft_picks||[]).forEach(function(p){ if(p.owner_id===rid) gets.push(p.season+" round "+p.round+" pick"); });
        lines.push(teamName(rid)+" gets "+(gets.join(", ")||"nothing"));
      });
      L.push("Week "+t._week+": "+lines.join(" | "));
    });
    L.push("");
  }

  var fa=S.transactions.filter(function(t){ return t.type==="free_agent"&&t.status==="complete"; }).slice(0,20);
  if(fa.length){
    L.push("RECENT FREE AGENT MOVES");
    fa.forEach(function(t){
      var a=[],d=[];
      if(t.adds) Object.keys(t.adds).forEach(function(pid){ a.push(playerName(pid)+" to "+teamName(t.adds[pid])); });
      if(t.drops) Object.keys(t.drops).forEach(function(pid){ d.push(playerName(pid)+" from "+teamName(t.drops[pid])); });
      L.push("Week "+t._week+": added "+(a.join(", ")||"none")+"; dropped "+(d.join(", ")||"none"));
    });
  }

  L.push(editorialContext());

  L.push("HOW TO USE THIS");
  L.push("Work out what actually changed since the previous edition first, then continue existing");
  L.push("storylines, then check whether any earlier take can now be judged, then look for new stories.");
  L.push("Do not manufacture continuity and do not rerun last week's article unless the evidence moved.");
  L.push("Every factual claim must come from this briefing. Analysts may exaggerate what the facts mean;");
  L.push("they may not invent facts.");

  return L.join("\n");
}

function renderWeek(){
  var rows=S.matchups[S.week]||[], groups={};
  rows.forEach(function(m){
    var k=m.matchup_id==null?("bye"+m.roster_id):m.matchup_id;
    (groups[k]=groups[k]||[]).push(m);
  });
  var keys=Object.keys(groups);
  if(!keys.length){
    $("tab-week").innerHTML='<h2>Week '+S.week+'</h2><div class="msg">No matchups posted yet for this week.</div>';
    return;
  }
  keys.sort(function(a,b){
    var sa=groups[a].reduce(function(t,m){return t+(Number(m.points)||0);},0);
    var sb=groups[b].reduce(function(t,m){return t+(Number(m.points)||0);},0);
    return sb-sa;
  });
  var html='<h2>Week '+S.week+'</h2><p class="note">Scores update live during games.</p><div class="board">';
  keys.forEach(function(k){
    var g=groups[k];
    if(g.length===1){ html+='<div class="game">'+sideHTML(g[0],true)+'<div class="gap">No opponent this week.</div></div>'; return; }
    var a=g[0],b=g[1],pa=Number(a.points)||0,pb=Number(b.points)||0;
    var lead=pa===pb?"Tied":teamName(pa>pb?a.roster_id:b.roster_id)+" by "+num(Math.abs(pa-pb));
    var pr=projLine(a,b);
    html+='<div class="game">'+sideHTML(a,pa>=pb)+sideHTML(b,pb>=pa)
      +'<div class="gap">'+esc(lead)+(pr?' &nbsp;&middot;&nbsp; '+esc(pr):'')+'</div></div>';
  });
  $("tab-week").innerHTML=html+'</div>';
}
/* Projected total for a side, using whoever is actually in the lineup. */
function projFor(m){
  if(!S.projections) return null;
  var ids=m.starters&&m.starters.length?m.starters:(m.players||[]);
  if(!ids.length) return null;
  var t=0,n=0;
  ids.forEach(function(pid){
    if(!pid||pid==="0") return;
    var v=S.projections[pid];
    if(v!=null){ t+=v; n++; }
  });
  return n?t:null;
}
function projLine(a,b){
  if(S.projWeek!==S.week) return "";
  var pa=projFor(a), pb=projFor(b);
  if(pa==null||pb==null) return "";
  return "Projected " + num(pa,1) + " to " + num(pb,1);
}

   SCHEDULE + EFFICIENCY
   ============================================================ */
function schedulesByWeek(){
  var out={};
  Object.keys(S.matchups).forEach(function(w){
    var g={};
    (S.matchups[w]||[]).forEach(function(m){
      if(m.matchup_id==null) return;
      (g[m.matchup_id]=g[m.matchup_id]||[]).push(m.roster_id);
    });
    var map={};
    Object.keys(g).forEach(function(k){
      var p=g[k];
      if(p.length===2){ map[p[0]]=p[1]; map[p[1]]=p[0]; }
    });
    if(Object.keys(map).length) out[w]=map;
  });
  return out;
}

function scoresByWeek(){
  var out={};
  Object.keys(S.matchups).forEach(function(w){
    if(Number(w)>S.finalWeek) return;
    var any=false, map={};
    (S.matchups[w]||[]).forEach(function(m){
      var p=Number(m.points)||0;
      map[m.roster_id]=p;
      if(p>0) any=true;
    });
    if(any) out[w]=map;
  });
  return out;
}

/* What each team actually scored versus the most they could have. */
function computeEfficiency(){
  if(!S.players){ S.eff=null; return; }
  var slots=(S.league&&S.league.roster_positions)||[];
  if(!slots.length){ S.eff=null; return; }

  var eff={};
  S.rosters.forEach(function(r){ eff[r.roster_id]={actual:0,optimal:0,weeks:[]}; });

  Object.keys(S.matchups).forEach(function(w){
    if(Number(w)>S.finalWeek) return;
    (S.matchups[w]||[]).forEach(function(m){
      var e=eff[m.roster_id];
      if(!e) return;
      var pp=m.players_points||{};
      var ids=(m.players&&m.players.length)?m.players:Object.keys(pp);
      if(!ids.length) return;
      var best=optimalLineup(ids,pp,slots,S.players);
      if(!best||!best.points) return;
      var actual=Number(m.points)||0;
      e.actual+=actual;
      e.optimal+=best.points;
      e.weeks.push({week:Number(w),actual:actual,optimal:best.points,lineup:best.lineup});
    });
  });

  Object.keys(eff).forEach(function(k){
    var e=eff[k];
    e.pct=e.optimal?e.actual/e.optimal:null;
    e.lost=e.optimal-e.actual;
  });
  S.eff=eff;
}

/* ============================================================
   ARCHIVE — past editions, so the newsroom has a memory
   ============================================================ */
function bust(u){ return u + (u.indexOf("?")<0?"?":"&") + "t=" + Date.now(); }

function loadArchive(){
  if(S.archivePromise) return S.archivePromise;
  S.archivePromise = fetch(bust(ARCHIVE_URL+"index.json"),{cache:"no-store"})
    .then(function(r){
      if(!r.ok) throw new Error("no archive index (" + r.status + ")");
      return r.json();
    })
    .then(function(idx){
      var eds = (idx && idx.editions) || [];
      eds = eds.slice(-12);
      return Promise.all(eds.map(function(e){
        var file = typeof e === "string" ? e : e.file;
        if(!file) return null;
        return fetch(bust(ARCHIVE_URL+file),{cache:"no-store"})
          .then(function(r){ return r.ok?r.json():null; })
          .catch(function(){ return null; })
          .then(function(doc){
            if(!doc) return null;
            if(typeof e === "object"){
              if(doc.week==null && e.week!=null) doc.week = e.week;
              if(!doc.generated && e.generated) doc.generated = e.generated;
            }
            return doc;
          });
      }));
    })
    .then(function(list){
      S.archive = list.filter(Boolean).sort(function(a,b){ return (a.week||0)-(b.week||0); });
      S.archiveError = null;
      return S.archive;
    })
    .catch(function(e){
      S.archive = [];
      S.archiveError = e.message || String(e);
      return S.archive;
    });
  return S.archivePromise;
}

/* Current edition plus every archived one, oldest first. An archived copy of
   the edition that is still on the front page would otherwise be counted
   twice, so match on week and headline and keep the live one. */
function allEditions(){
  var out = (S.archive || []).slice();
  if(S.news){
    var key = editionKey(S.news);
    out = out.filter(function(e){ return editionKey(e) !== key; });
    out.push(S.news);
  }
  return out;
}
function editionKey(ed){
  if(!ed) return "";
  var first = (ed.stories && ed.stories[0] && ed.stories[0].headline) || "";
  return (ed.week==null?"?":ed.week) + "|" + first;
}

/* Where each team actually sits right now. */
function actualRankMap(){
  if(!S.finalWeek) return null;
  var rows = S.rosters.map(function(r){
    var st = r.settings||{};
    return {rid:r.roster_id, w:Number(st.wins)||0, pf:pts(st.fpts,st.fpts_decimal)};
  }).sort(function(a,b){ return b.w-a.w || b.pf-a.pf; });
  var map = {};
  rows.forEach(function(r,i){ map[r.rid] = i+1; });
  return map;
}

/* ============================================================
   PROJECTIONS
   ============================================================ */
function scoringKey(){
  var ss=(S.league&&S.league.scoring_settings)||{};
  var rec=Number(ss.rec)||0;
  if(rec>=1) return "pts_ppr";
  if(rec>0)  return "pts_half_ppr";
  return "pts_std";
}

function loadProjections(){
  var week=S.week, season=S.league&&S.league.season;
  if(!season) return Promise.resolve();
  S.projWeek=week;
  var url=PROJ_API+"/projections/nfl/"+season+"/"+week+"?season_type=regular&order_by=ppr";
  return fetch(url)
    .then(function(r){
      if(!r.ok) throw new Error("projections returned "+r.status);
      return r.json();
    })
    .then(function(list){
      if(!list||!list.length) throw new Error("projections came back empty");
      var key=scoringKey(), map={}, n=0;
      list.forEach(function(row){
        var pid=row.player_id||(row.player&&row.player.player_id);
        if(!pid) return;
        var st=row.stats||{};
        var v=st[key];
        if(v==null) v=st.pts_ppr;
        if(v==null) v=st.pts_std;
        if(v==null) return;
        map[pid]=Number(v)||0; n++;
      });
      if(!n) throw new Error("no usable point values in the projection feed");
      S.projections=map;
      S.projError=null;
    })
    .catch(function(e){
      S.projections=null;
      S.projError=e.message||String(e);
    });
}

/* What each roster's best lineup projects for, before anything is played. */
function projectedStrength(){
  if(!S.projections||!S.players) return null;
  var slots=(S.league&&S.league.roster_positions)||[];
  if(!slots.length) return null;
  var out={};
  S.rosters.forEach(function(r){
    var ids=r.players||[];
    if(!ids.length) return;
    var best=optimalLineup(ids,S.projections,slots,S.players);
    if(best&&best.points) out[r.roster_id]=best.points;
  });
  return Object.keys(out).length?out:null;
}

/* ============================================================
   PLAYOFF ODDS
   ============================================================ */
function playoffOdds(){
  var scores=scoresByWeek(), sched=schedulesByWeek();
  var perTeam={};
  S.rosters.forEach(function(r){ perTeam[r.roster_id]=[]; });
  Object.keys(scores).forEach(function(w){
    Object.keys(scores[w]).forEach(function(rid){
      if(perTeam[rid]) perTeam[rid].push(scores[w][rid]);
    });
  });

  var proj=projectedStrength();
  var played=0;
  S.rosters.forEach(function(r){ played=Math.max(played,(perTeam[r.roster_id]||[]).length); });

  // Nothing to go on at all.
  if(!proj && played<2) return null;

  var all=[];
  Object.keys(perTeam).forEach(function(k){ all=all.concat(perTeam[k]); });
  var leagueSd=meanSd(all).sd;

  var teams=S.rosters.map(function(r){
    var st=r.settings||{};
    var list=perTeam[r.roster_id]||[];
    var ms=meanSd(list);
    var p=proj?proj[r.roster_id]:null;
    var mean=blendMean(ms.mean,list.length,p!=null?p:null);
    var sd;
    if(list.length>=3&&ms.sd>0) sd=ms.sd;
    else if(leagueSd>0) sd=leagueSd;
    else sd=Math.max(18,mean*0.20);      // typical weekly spread when nothing is known
    return {
      rid:r.roster_id,
      wins:(Number(st.wins)||0)+(Number(st.ties)||0)*0.5,
      pts:pts(st.fpts,st.fpts_decimal),
      mean:mean, sd:sd
    };
  });

  var remaining=[];
  for(var w=S.finalWeek+1; w<=S.regWeeks; w++){
    if(!sched[w]) continue;
    var seen={}, pairs=[];
    Object.keys(sched[w]).forEach(function(a){
      var b=sched[w][a];
      var key=Math.min(a,b)+"-"+Math.max(a,b);
      if(seen[key]) return;
      seen[key]=1;
      pairs.push([Number(a),Number(b)]);
    });
    if(pairs.length) remaining.push({week:w,pairs:pairs});
  }

  var spots=(S.league.settings&&S.league.settings.playoff_teams)||6;
  var res=simulateSeason({teams:teams,schedule:remaining,playoffSpots:spots,runs:5000});
  var meanBy={};
  teams.forEach(function(t){ meanBy[t.rid]=t; });
  return {rows:res, weeksLeft:remaining.length, spots:spots,
          basis:(proj?(played>=2?"blend":"projection"):"scores"), teams:meanBy, played:played};
}
