/* ============================================================
   THE POLL
   Analysts submit ballots in news.json. The page does the counting,
   which keeps the opinions opinionated and the arithmetic honest.
   ============================================================ */
function resolveTeam(name){
  var n=String(name||"").trim().toLowerCase();
  if(!n) return null;
  var i, rid;
  for(i=0;i<S.rosters.length;i++){
    rid=S.rosters[i].roster_id;
    if(teamName(rid).trim().toLowerCase()===n) return rid;
  }
  for(i=0;i<S.rosters.length;i++){
    rid=S.rosters[i].roster_id;
    if(String(manager(rid)).trim().toLowerCase()===n) return rid;
  }
  // Curly apostrophes, emoji and stray punctuation should never decide this.
  var k=normKey(n);
  if(k){
    for(i=0;i<S.rosters.length;i++){
      rid=S.rosters[i].roster_id;
      if(normKey(teamName(rid))===k) return rid;
    }
    for(i=0;i<S.rosters.length;i++){
      rid=S.rosters[i].roster_id;
      var tk=normKey(teamName(rid));
      if(tk&&(tk.indexOf(k)===0||k.indexOf(tk)===0)) return rid;
    }
  }
  for(i=0;i<S.rosters.length;i++){
    rid=S.rosters[i].roster_id;
    var t=teamName(rid).trim().toLowerCase();
    if(t.indexOf(n)===0||n.indexOf(t)===0) return rid;
  }
  return null;
}
function normKey(s){
  return String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]/g,"");
}

function ballotsHTML(){
  var poll=S.news&&S.news.poll;
  if(!poll||!poll.ballots||!poll.ballots.length) return "";

  var voters=[], tally={}, unresolved=[];
  poll.ballots.forEach(function(b){
    var order=b.ranking||[];
    if(!order.length) return;
    var a=ANALYSTS[b.analyst]||{name:b.analyst||"Anonymous",role:"",color:"var(--dim)"};
    voters.push({key:b.analyst, meta:a, comment:b.comment||""});
    order.forEach(function(nm,i){
      var rid=resolveTeam(nm);
      if(rid==null){ if(unresolved.indexOf(nm)<0) unresolved.push(nm); return; }
      if(!tally[rid]) tally[rid]={rid:rid, points:0, firsts:0, ranks:{}};
      tally[rid].points += (order.length - i);
      if(i===0) tally[rid].firsts++;
      tally[rid].ranks[b.analyst] = i+1;
    });
  });
  if(!voters.length) return "";

  var rows=Object.keys(tally).map(function(k){ return tally[k]; })
    .sort(function(a,b){ return b.points-a.points||b.firsts-a.firsts; });
  if(!rows.length) return "";

  var h='<h2 style="margin-top:34px">'+esc(poll.title||"The desk ballots")+'</h2>'
    +'<p class="note">'
    +esc(poll.note||("Each analyst files a full ranking. First place is worth "+S.rosters.length+" points down to 1, exactly like the college football polls. The page counts the votes; the table above is the arithmetic they are arguing with."))
    +'</p>';

  h+='<div class="scroll"><table><thead><tr><th></th><th>Team</th><th>Points</th><th>First</th>';
  voters.forEach(function(v){
    var short=v.meta.name.split(" ").slice(-1)[0];
    h+='<th>'+esc(short)+'</th>';
  });
  h+='<th>Spread</th></tr></thead><tbody>';

  rows.forEach(function(r,i){
    h+='<tr class="rank-'+(i+1)+'"><td>'+(i+1)+'</td><td>'+teamCell(r.rid)+'</td>'
      +'<td>'+r.points+'</td><td>'+(r.firsts||'')+'</td>';
    var vals=[];
    voters.forEach(function(v){
      var rk=r.ranks[v.key];
      if(rk) vals.push(rk);
      h+='<td>'+(rk||'--')+'</td>';
    });
    var spread=vals.length>1?Math.max.apply(null,vals)-Math.min.apply(null,vals):0;
    h+='<td class="'+(spread>=5?"neg":"")+'">'+(spread||'')+'</td></tr>';
  });
  h+='</tbody></table></div>';

  // Where the room disagrees most.
  var arg=rows.slice().map(function(r){
    var vals=[];
    voters.forEach(function(v){ if(r.ranks[v.key]) vals.push({k:v.key,r:r.ranks[v.key]}); });
    if(vals.length<2) return null;
    vals.sort(function(a,b){ return a.r-b.r; });
    return {rid:r.rid, low:vals[0], high:vals[vals.length-1], spread:vals[vals.length-1].r-vals[0].r};
  }).filter(Boolean).sort(function(a,b){ return b.spread-a.spread; })[0];

  if(arg&&arg.spread>=3){
    var hiName=(ANALYSTS[arg.low.k]||{}).name||arg.low.k;
    var loName=(ANALYSTS[arg.high.k]||{}).name||arg.high.k;
    h+='<div class="wire" style="margin-top:14px"><div class="wire-item">'
      +'<div class="hl"><span class="tag">Split</span>'+esc(teamName(arg.rid))
      +' is the biggest argument in the room</div>'
      +'<div class="dt">'+esc(hiName)+' has them '+ordinal(arg.low.r)+'. '
      +esc(loName)+' has them '+ordinal(arg.high.r)+'. '+arg.spread+' spots apart.</div></div></div>';
  }

  if(voters.some(function(v){ return v.comment; })){
    h+='<div class="takes" style="margin-top:18px;border-top:none;padding-top:0">';
    voters.forEach(function(v){
      if(!v.comment) return;
      h+='<div class="take">'
        +faceHTML(v.meta,false)
        +'<div class="body"><div class="who">'+esc(v.meta.name)
        +(v.meta.role?'<span class="role">'+esc(v.meta.role)+'</span>':'')+'</div>'
        +'<div class="txt">'+esc(v.comment)+'</div></div></div>';
    });
    h+='</div>';
  }

  if(unresolved.length){
    h+='<p class="note" style="margin-top:12px">Not matched to a team: '+esc(unresolved.join(", "))+'</p>';
  }
  return h+'<div style="height:34px"></div>';
}

/* ============================================================
   SHARE CARD
   Draws the week onto a canvas and hands it to the phone's share
   sheet, or downloads it on desktop. The point is that the site
   produces the thing that gets posted, instead of hoping somebody
   remembers to open it.
   ============================================================ */
var SHARE_W = 1080, SHARE_H = 1350;
var SHARE_PAL = {
  turf:"#0D1411", panel:"#141F1A", panel2:"#1B2A23", line:"#25392F",
  text:"#E9EFEA", dim:"#8CA398", gold:"#F0C24B", flag:"#E2593B", good:"#5FCB8B"
};

function shareFont(size, weight, cond){
  return (weight||500) + " " + size + "px " +
    (cond ? "'Barlow Condensed','Barlow'," : "'Barlow',") +
    "system-ui,-apple-system,'Segoe UI',sans-serif";
}

/* Trim to fit, with an ellipsis, so a long team name never runs off the card. */
function fitText(ctx, str, max){
  str = String(str == null ? "" : str);
  if(ctx.measureText(str).width <= max) return str;
  var s = str;
  while(s.length > 1 && ctx.measureText(s + "…").width > max) s = s.slice(0, -1);
  return s + "…";
}

/* Wrap to at most `max` lines, ellipsing the last rather than cutting a word in half. */
function wrapLines(ctx, text, maxW, max){
  var words = String(text||"").split(/\s+/), line = "", lines = [];
  for(var i = 0; i < words.length; i++){
    var test = line ? line + " " + words[i] : words[i];
    if(ctx.measureText(test).width > maxW && line){
      lines.push(line); line = words[i];
      if(lines.length === max - 1){
        lines.push(fitText(ctx, words.slice(i).join(" "), maxW));
        return lines;
      }
    } else line = test;
  }
  if(line) lines.push(line);
  return lines.slice(0, max);
}

/* The shortest take that is still substantial. A card wants a punchline, not a
   paragraph, and the one-liners are the ones people actually repeat. */
function pickShareQuote(){
  var best = null, fb = null;
  ((S.news && S.news.stories) || []).forEach(function(st){
    (st.takes || []).forEach(function(t){
      var a = ANALYSTS[t.analyst];
      if(!a || !t.text) return;
      if(!fb) fb = {who: a.name, text: t.text};
      if(t.text.length < 60) return;
      if(!best || t.text.length < best.text.length) best = {who: a.name, text: t.text};
    });
  });
  return best || fb;
}

function shareWeekNumber(){
  // the most recent week with real scores, else whatever week we are in
  var wk = S.week;
  for(var w = S.week; w >= 1; w--){
    var arr = S.matchups[w] || [];
    if(arr.some(function(m){ return (Number(m.points)||0) > 0; })){ wk = w; break; }
  }
  return wk;
}

function drawShareCard(){
  var c = document.createElement("canvas");
  c.width = SHARE_W; c.height = SHARE_H;
  var x = c.getContext("2d"), P = SHARE_PAL, pad = 64;

  x.fillStyle = P.turf; x.fillRect(0, 0, SHARE_W, SHARE_H);

  // accent bar
  var seg = SHARE_W / 5, cols = [P.gold, P.flag, P.good, "#6FB3D2", "#A98BD6"];
  cols.forEach(function(col, i){ x.fillStyle = col; x.fillRect(i*seg, 0, seg, 10); });

  var wk = shareWeekNumber();
  var y = 118;
  x.fillStyle = P.gold; x.font = shareFont(30, 700, true);
  x.fillText("WEEK " + wk, pad, y);
  y += 66;
  x.fillStyle = P.text; x.font = shareFont(62, 700, true);
  x.fillText(fitText(x, (S.league && S.league.name) || "Fantasy Football", SHARE_W - pad*2), pad, y);

  // ---- scoreboard
  y += 54;
  x.fillStyle = P.line; x.fillRect(pad, y, SHARE_W - pad*2, 2);
  y += 46;
  x.fillStyle = P.dim; x.font = shareFont(24, 600, true);
  x.fillText("SCOREBOARD", pad, y);
  y += 26;

  var gs = games(wk);
  var rowH = 78;
  gs.slice(0, 6).forEach(function(g){
    x.fillStyle = P.panel;
    x.fillRect(pad, y, SHARE_W - pad*2, rowH - 10);
    var midY = y + (rowH - 10)/2 + 9;

    x.textAlign = "right";
    x.fillStyle = P.gold; x.font = shareFont(30, 700, true);
    x.fillText(num(g.winPts, 1), SHARE_W - pad - 22, midY - 16);
    x.fillStyle = P.dim;
    x.fillText(num(g.losePts, 1), SHARE_W - pad - 22, midY + 18);

    x.textAlign = "left";
    var nameMax = SHARE_W - pad*2 - 200;
    x.fillStyle = P.text; x.font = shareFont(28, 600);
    x.fillText(fitText(x, teamName(g.win.roster_id), nameMax), pad + 22, midY - 16);
    x.fillStyle = P.dim; x.font = shareFont(26, 400);
    x.fillText(fitText(x, teamName(g.lose.roster_id), nameMax), pad + 22, midY + 18);
    y += rowH;
  });

  // ---- power rankings, top three
  var pr = powerRows();
  if(pr && pr.length){
    y += 24;
    x.fillStyle = P.dim; x.font = shareFont(24, 600, true);
    x.fillText("POWER RANKINGS", pad, y);
    y += 40;
    pr.slice(0, 3).forEach(function(r, i){
      x.fillStyle = i === 0 ? P.gold : P.text;
      x.font = shareFont(32, 700, true);
      x.fillText(String(i + 1), pad, y);
      x.font = shareFont(30, i === 0 ? 700 : 500);
      x.fillText(fitText(x, teamName(r.id), SHARE_W - pad*2 - 150), pad + 42, y);
      x.textAlign = "right"; x.fillStyle = P.dim; x.font = shareFont(28, 500, true);
      x.fillText(num(r.score, 1), SHARE_W - pad, y);
      x.textAlign = "left";
      y += 46;
    });
  }

  // ---- one line from the desk, anchored to the bottom so the card never
  //      ends with a slab of empty space
  var quote = pickShareQuote();
  if(quote){
    x.font = shareFont(30, 400);
    var lines = wrapLines(x, quote.text, SHARE_W - pad*2, 4);
    var blockH = lines.length * 42 + 46;
    var qy = SHARE_H - 76 - 40 - blockH;
    if(qy < y + 20) qy = y + 20;           // never collide with the rankings
    x.fillStyle = P.line; x.fillRect(pad, qy - 46, SHARE_W - pad*2, 2);
    x.fillStyle = P.text;
    lines.forEach(function(ln){ x.fillText(ln, pad, qy); qy += 42; });
    qy += 8;
    x.fillStyle = P.gold; x.font = shareFont(26, 600, true);
    x.fillText("\u2014 " + quote.who, pad, qy);
  }

  // ---- footer
  x.fillStyle = P.line; x.fillRect(0, SHARE_H - 76, SHARE_W, 2);
  x.fillStyle = P.dim; x.font = shareFont(24, 500);
  x.fillText(location.host + location.pathname.replace(/\/$/, ""), pad, SHARE_H - 30);

  return c;
}

function shareWeek(){
  var btn = $("shareBtn");
  function done(msg){
    if(!btn) return;
    btn.textContent = msg;
    setTimeout(function(){ btn.textContent = "Share this week"; }, 4000);
  }
  var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  ready.then(function(){
    var c;
    try { c = drawShareCard(); }
    catch(e){ done("Could not build the card"); return; }
    if(!c.toBlob){ done("Not supported in this browser"); return; }
    c.toBlob(function(blob){
      if(!blob){ done("Could not build the card"); return; }
      var name = "week-" + shareWeekNumber() + ".png";
      var file = null;
      try { file = new File([blob], name, {type: "image/png"}); } catch(e){}
      if(file && navigator.canShare && navigator.canShare({files: [file]}) && navigator.share){
        navigator.share({files: [file]}).then(function(){ done("Shared"); },
          function(){ done("Share this week"); });
        return;
      }
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      done("Saved " + name);
    }, "image/png");
  });
}

/* Desk tool. Regular visitors see no sign the card exists. */
function shareBarHTML(){
  return '<div class="sharebar">'
    + '<button class="btn" id="shareBtn">Share this week</button>'
    + '<span class="hint">Builds an image of this week to drop in the group chat. '
    + 'Only visible because this URL ends in ?desk.</span>'
    + '</div>';
}

function renderNews(){
  var stories=(S.news&&S.news.stories)||[];

  var html=(DESK?shareBarHTML():"")+tocHTML(stories);

  html+='<h2>The wire</h2>'
    +'<p class="note">'
    +(S.finalWeek
      ? 'Written by the page itself from this week&rsquo;s actual numbers. Always current, never wrong, no opinions it cannot back up.'
      : 'Written by the page itself. Nothing has been played, so everything here comes from the projections.')
    +'</p>';

  var wire=buildWire();
  if(wire.length){
    html+='<div class="wire">';
    wire.forEach(function(i){
      html+='<div class="wire-item"><div class="hl"><span class="tag">'+esc(i.tag)+'</span>'+i.hl+'</div>'
        +'<div class="dt">'+i.dt+'</div></div>';
    });
    html+='</div>';
  } else {
    html+='<div class="msg" style="margin-bottom:34px">Nothing to report yet. The wire fills in as soon as a week goes final.</div>';
  }


  html+='<h2>The desk</h2>'
    +'<p class="note">Analysis, argument, and the occasional grudge.</p>';

  if(stories.length){
    stories.forEach(function(st,i){ html+=storyHTML(st,i); });
  } else {
    html+='<div class="msg">No stories filed yet this week. The wire above never sleeps.</div>';
  }

  // The briefing tools only exist for whoever knows to add ?desk to the URL.
  if(DESK){
    html+='<div class="bar">'
      +'<button class="btn" id="copyBriefing">Copy this week&rsquo;s briefing</button>'
      +'<span class="hint">Only visible because this URL ends in ?desk. Nobody else sees this.</span>'
      +'</div>';
  }

  $("tab-news").innerHTML=html;

  var sb=$("shareBtn");
  if(sb) sb.addEventListener("click", shareWeek);

  Array.prototype.forEach.call(document.querySelectorAll(".toc-item"), function(el){
    el.addEventListener("click", function(){
      var target=$("story-"+el.dataset.story);
      if(!target) return;
      var reduce=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      try { target.scrollIntoView({behavior:reduce?"auto":"smooth", block:"start"}); }
      catch(e){ target.scrollIntoView(); }
    });
  });

  var b=$("copyBriefing");
  if(b) b.addEventListener("click",copyBriefing);
}

/* A wire-style index of what is on the desk, so the front page reads like
   a front page instead of a scroll. */
function tocHTML(stories){
  if(!stories || !stories.length) return "";
  var h='<h2>In this edition</h2>'
    +'<p class="note">'+stories.length+' '+(stories.length===1?'story':'stories')
    +' on the desk. Tap one to jump to it.</p>'
    +'<div class="wire toc">';
  stories.forEach(function(st,i){
    var body=String(st.body||"").trim();
    var first=body.split(/(?<=[.!?])\s/)[0] || "";
    if(first.length>150) first=first.slice(0,147).replace(/\s+\S*$/,"")+"...";
    h+='<button type="button" class="wire-item toc-item" data-story="'+i+'">'
      +'<span class="hl"><span class="tag">'+(i+1)+'</span>'+esc(st.headline||"Untitled")+'</span>'
      +(first?'<span class="dt">'+esc(first)+'</span>':'')
      +'</button>';
  });
  return h+'</div>';
}

/* An analyst's portrait. Drawn, not photographed -- these are invented people.
   Any key news.json makes up that the desk does not have falls back to initials. */
function faceHTML(a, big){
  var cls = "face" + (big ? " big" : "");
  var nm = (a && a.name) ? a.name : "";
  // The drawing sits underneath as a fallback. If the portrait file is missing
  // or renamed, the <img> removes itself and the drawing shows through instead
  // of leaving a hole.
  if(a && a.image){
    return '<div class="'+cls+'">' + (a.art||"")
      + '<img class="face-img" src="'+esc(a.image)+'?v='+ASSET_V+'" alt="'+esc(nm)+'" loading="lazy">'
      + '</div>';
  }
  if(a && a.art) return '<div class="'+cls+'">'+a.art+'</div>';
  var initials = nm ? nm.replace(/^The\s+/i,"").slice(0,2) : "??";
  return '<div class="'+cls+'" style="background:'+((a&&a.color)||"var(--dim)")+'">'+esc(initials)+'</div>';
}

/* One capture-phase listener for every portrait on the page: img error events do
   not bubble, so this catches them on the way down and falls back to the drawing. */
document.addEventListener("error", function(e){
  var el = e.target;
  if(!el || el.tagName !== "IMG") return;
  if(el.id === "deskshot-img" && el.parentNode){ el.parentNode.innerHTML = DESK_BANNER; return; }
  if(el.className === "face-img") el.remove();
}, true);

function storyHTML(st,i){
  var h='<article class="story" id="story-'+i+'">';
  if(st.sample) h+='<div class="sample">Sample story.</div>';
  h+='<h3>'+esc(st.headline||"Untitled")+'</h3>';
  String(st.body||"").split(/\n\s*\n/).forEach(function(p){
    if(p.trim()) h+='<p>'+esc(p.trim())+'</p>';
  });
  if(st.takes&&st.takes.length){
    h+='<div class="takes">';
    st.takes.forEach(function(t){
      var a=ANALYSTS[t.analyst]||{name:t.analyst||"Anonymous",role:"",color:"var(--dim)"};
      h+='<div class="take">'
        +faceHTML(a,false)
        +'<div class="body"><div class="who">'+esc(a.name)
        +(a.role?'<span class="role">'+esc(a.role)+'</span>':'')+'</div>'
        +'<div class="txt">'+esc(t.text||"")+'</div></div></div>';
    });
    h+='</div>';
  }
  return h+'</article>';
}

/* ============================================================
   BRIEFING — one clipboard dump of every fact the site knows
   ============================================================ */
/* Everything the writer needs to know about what has already been published. */
function editorialContext(){
  var L = [], eds = allEditions();
  if(!eds.length) return "";

  L.push("EDITORIAL CONTEXT");
  if(S.archiveError) L.push("(archive unavailable: " + S.archiveError + ")");

  var prev = eds.slice(-2);
  prev.forEach(function(ed){
    var label = ed.week!=null ? ("WEEK " + ed.week) : "PREVIOUS";
    L.push("");
    L.push(label + " HEADLINES");
    (ed.stories||[]).forEach(function(s){ L.push("- " + s.headline); });
  });

  var last = eds[eds.length-1];
  if(last && last.stories){
    var byAnalyst = {};
    last.stories.forEach(function(s){
      (s.takes||[]).forEach(function(t){
        var a = ANALYSTS[t.analyst];
        if(!a) return;
        (byAnalyst[a.name] = byAnalyst[a.name] || []).push(t.text);
      });
    });
    if(Object.keys(byAnalyst).length){
      L.push("");
      L.push("MOST RECENT ANALYST TAKES (these are on the record and can be judged)");
      Object.keys(byAnalyst).forEach(function(nm){
        L.push(nm + ":");
        byAnalyst[nm].slice(0,4).forEach(function(t){
          L.push("  - " + (t.length>200 ? t.slice(0,197)+"..." : t));
        });
      });
    }
  }

  // Ballots, plus how they are holding up. Capped so the briefing stays pasteable.
  var actual = powerRankMap();
  var polled = eds.filter(function(ed){ return ed.poll && ed.poll.ballots && ed.poll.ballots.length; });
  polled.slice(-2).forEach(function(ed){
    L.push("");
    L.push("BALLOTS ON THE RECORD: " + (ed.poll.title || "poll")
      + (ed.week!=null ? " (week " + ed.week + ")" : ""));
    ed.poll.ballots.forEach(function(b){
      var a = ANALYSTS[b.analyst];
      if(!a || !b.ranking) return;
      L.push(a.name + ": " + b.ranking.join(" > "));
      if(actual){
        var ids = b.ranking.map(function(nm){ return resolveTeam(nm); }).filter(function(x){ return x!=null; });
        var sc = scoreRanking(ids, actual);
        if(sc){
          L.push("  scored so far: " + Math.round(sc.pairwise*100) + "% pairwise, "
            + num(sc.mae,1) + " spots off on average"
            + (sc.worst ? ", worst call " + teamName(sc.worst.id)
                + " (had them " + sc.worst.predicted + ", actually " + sc.worst.actual + ")" : ""));
        }
      }
    });
  });

  var open = [];
  eds.forEach(function(ed){
    (ed.stories||[]).forEach(function(s){
      if(s.storyline) open.push(s.storyline);
    });
  });
  if(open.length){
    L.push("");
    L.push("ONGOING STORYLINES");
    open.forEach(function(s){ L.push("- " + s); });
  }

  L.push("");
  return L.join("\n");
}

/* Every starter, what they were projected for and what they actually did.
   Works mid-week, because Sleeper updates these while games are running. */
function currentWeekPlayers(){
  var rows = S.matchups[S.week] || [];
  if(!rows.length) return "";

  var L = [];
  L.push("PLAYER SCORING, WEEK " + S.week + " (" + (S.finalWeek >= S.week ? "final" : "still in progress") + ")");
  L.push("Starters listed as: player (position, NFL team) projected -> actual. A dash means no projection was published.");
  if(S.gameStatus){
    L.push("Each starter is tagged with his game state: yet to play, playing now, or final.");
    L.push("A player marked final with 0.00 scored nothing. He is not still to come.");
  } else {
    L.push("GAME STATUS UNAVAILABLE" + (S.statusError ? " (" + S.statusError + ")" : "")
      + ". A 0.00 may mean the player has not kicked off or may mean he scored nothing. Do not guess which.");
  }

  // Pair teams up so the writer can see both sides of a matchup together.
  var groups = {};
  rows.forEach(function(m){
    var k = m.matchup_id==null ? ("bye"+m.roster_id) : m.matchup_id;
    (groups[k] = groups[k] || []).push(m);
  });

  Object.keys(groups).forEach(function(k){
    var g = groups[k];
    L.push("");
    if(g.length === 2){
      L.push("MATCHUP: " + teamName(g[0].roster_id) + " " + num(g[0].points)
        + " vs " + teamName(g[1].roster_id) + " " + num(g[1].points));
    }
    g.forEach(function(m){
      var pp = m.players_points || {}, starters = m.starters || [];
      var projTotal = 0, hasProj = false;
      starters.forEach(function(pid){
        var PJs = projections();
        if(PJs && PJs[pid]!=null){ projTotal += Number(PJs[pid])||0; hasProj = true; }
      });
      var rem = remainingFor(m);
      L.push(teamName(m.roster_id) + " (" + manager(m.roster_id) + ") scored " + num(m.points)
        + (hasProj ? ", projected " + num(projTotal,1) : "")
        + (rem ? ", " + rem.count + " starter" + (rem.count===1?"":"s") + " left worth "
            + num(rem.proj,1) + " projected" : ""));
      starters.forEach(function(pid){
        if(!pid || pid==="0"){ L.push("  empty slot"); return; }
        var PJl = projections();
        var proj = (PJl && PJl[pid]!=null) ? num(PJl[pid],1) : "--";
        var meta = playerMeta(pid);
        var gs = stateLabel(playerGameState(pid));
        L.push("  " + playerName(pid) + (meta?" ("+meta+")":"") + " " + proj + " -> " + num(pp[pid]||0)
          + (gs ? "  [" + gs + "]" : ""));
      });
      var bench = [];
      (m.players||[]).forEach(function(pid){
        if(starters.indexOf(pid) < 0 && pp[pid]!=null) bench.push(playerName(pid)+" "+num(pp[pid]));
      });
      if(bench.length) L.push("  bench: " + bench.join(", "));
    });
  });
  L.push("");
  return L.join("\n");
}

/* An explicit list of what has not happened yet, so nobody has to infer it. */
function stillToPlay(){
  if(!S.gameStatus){
    return "STILL TO PLAY: unknown, the game status feed is unavailable.\n";
  }
  var rows = S.matchups[S.week] || [];
  if(!rows.length) return "";
  var groups = {};
  rows.forEach(function(m){
    var k = m.matchup_id==null ? ("bye"+m.roster_id) : m.matchup_id;
    (groups[k] = groups[k] || []).push(m);
  });

  var L = ["STILL TO PLAY, WEEK " + S.week];
  var live = 0;
  Object.keys(groups).forEach(function(k){
    var g = groups[k];
    if(g.length !== 2) return;
    var a = g[0], b = g[1];
    var sa = Number(a.points)||0, sb = Number(b.points)||0;
    var ra = remainingFor(a), rb = remainingFor(b);
    var lead = sa >= sb ? a : b, trail = sa >= sb ? b : a;
    var margin = Math.abs(sa-sb);
    var rLead = sa >= sb ? ra : rb, rTrail = sa >= sb ? rb : ra;

    var line = teamName(lead.roster_id) + " " + num(Math.max(sa,sb))
      + " leads " + teamName(trail.roster_id) + " " + num(Math.min(sa,sb))
      + " by " + num(margin) + ". "
      + teamName(trail.roster_id) + " has " + rTrail.count + " left ("
      + num(rTrail.proj,1) + " projected), "
      + teamName(lead.roster_id) + " has " + rLead.count + " left ("
      + num(rLead.proj,1) + " projected).";
    if(!rTrail.count){
      line += " DECIDED: the trailing team has nobody left.";
    } else {
      live++;
      line += " LIVE: needs " + num(margin + rLead.proj,1)
        + " from those players if the leader hits projection.";
    }
    L.push(line);
    rTrail.players.forEach(function(p){
      L.push("   " + teamName(trail.roster_id) + " still to come: " + playerName(p.pid)
        + " (" + (playerMeta(p.pid)||"?") + ") projected " + num(p.proj,1));
    });
    rLead.players.forEach(function(p){
      L.push("   " + teamName(lead.roster_id) + " still to come: " + playerName(p.pid)
        + " (" + (playerMeta(p.pid)||"?") + ") projected " + num(p.proj,1));
    });
  });
  L.push(live ? (live + " matchup" + (live===1?" is":"s are") + " still live.") : "Every matchup is decided.");
  L.push("");
  return L.join("\n");
}

function briefingText(){
  var L=[], wk=S.finalWeek||S.week;
  var ap=allPlay(), scores=weeklyScores();
  var budget=(S.league.settings&&S.league.settings.waiver_budget)||100;

  L.push("LEAGUE BRIEFING");
  L.push((S.league.name||"League")+", "+S.league.season+" season, through week "+wk);
  L.push("Teams: "+S.rosters.length+". FAAB budget: $"+budget+".");
  L.push("");

  L.push("STANDINGS (rank, team, manager, record, points for, points against, all-play, expected wins, luck)");
  var rows=S.rosters.map(function(r){
    var st=r.settings||{};
    var w=Number(st.wins)||0,l=Number(st.losses)||0,t=Number(st.ties)||0;
    var a=ap[r.roster_id]||{w:0,l:0,games:0};
    var pct=a.games?a.w/a.games:0;
    return {rid:r.roster_id,w:w,l:l,t:t,
      pf:pts(st.fpts,st.fpts_decimal), pa:pts(st.fpts_against,st.fpts_against_decimal),
      ap:a, exp:pct*(w+l+t), luck:w-pct*(w+l+t)};
  }).sort(function(a,b){ return b.w-a.w||b.pf-a.pf; });
  rows.forEach(function(r,i){
    L.push((i+1)+". "+teamName(r.rid)+" ("+manager(r.rid)+") "+r.w+"-"+r.l+(r.t?"-"+r.t:"")
      +", PF "+num(r.pf)+", PA "+num(r.pa)
      +", all-play "+r.ap.w+"-"+r.ap.l
      +", expected "+num(r.exp,1)+", luck "+(r.luck>0?"+":"")+num(r.luck,1));
  });
  L.push("");

  if(S.finalWeek){
    var bench=benchPoints(S.finalWeek);
    L.push("WEEK "+S.finalWeek+" RESULTS");
    games(S.finalWeek).forEach(function(g){
      L.push(teamName(g.win.roster_id)+" "+num(g.winPts)+" def "+teamName(g.lose.roster_id)+" "+num(g.losePts)
        +" (margin "+num(g.margin)+")");
    });
    L.push("");
    L.push("WEEK "+S.finalWeek+" BENCH POINTS (points left unstarted, best benched player)");
    Object.keys(bench).forEach(function(rid){
      var b=bench[rid];
      L.push(teamName(Number(rid))+": "+num(b.points,1)
        +(b.best?", best bench "+playerName(b.best.pid)+" "+num(b.best.points,1):""));
    });
    L.push("");
  }

  L.push("SCORING BY WEEK");
  S.rosters.forEach(function(r){
    var list=scores[r.roster_id]||[];
    if(!list.length) return;
    L.push(teamName(r.roster_id)+": "+list.map(function(s){ return "wk"+s.week+" "+num(s.points,1); }).join(", "));
  });
  L.push("");

  L.push("FAAB REMAINING");
  S.rosters.map(function(r){
    return {rid:r.roster_id, used:Number((r.settings||{}).waiver_budget_used)||0};
  }).sort(function(a,b){ return a.used-b.used; }).forEach(function(r){
    L.push(teamName(r.rid)+": $"+(budget-r.used)+" left, $"+r.used+" spent");
  });
  L.push("");

  if(S.eff){
    L.push("LINEUP EFFICIENCY (actual points as a share of the best lineup available)");
    S.rosters.map(function(r){
      var e=S.eff[r.roster_id];
      return e&&e.pct!=null?{rid:r.roster_id,pct:e.pct,lost:e.lost}:null;
    }).filter(Boolean).sort(function(a,b){ return b.pct-a.pct; }).forEach(function(r){
      L.push(teamName(r.rid)+": "+Math.round(r.pct*100)+"%, "+num(r.lost,1)+" points left unstarted");
    });
    L.push("");
  }

  var strength=projectedStrength();
  if(strength){
    L.push("PROJECTED WEEKLY SCORE (best lineup each roster could start, week "+S.projWeek+")");
    S.rosters.map(function(r){ return {rid:r.roster_id, p:strength[r.roster_id]}; })
      .filter(function(x){ return x.p!=null; })
      .sort(function(a,b){ return b.p-a.p; })
      .forEach(function(x,i){ L.push((i+1)+". "+teamName(x.rid)+": "+num(x.p,1)); });
    L.push("");
  } else if(S.projError){
    L.push("PROJECTIONS UNAVAILABLE: "+S.projError);
    L.push("");
  }

  if(S.projGaps && S.projGaps.length){
    L.push("MISSING PROJECTIONS (substituted with replacement level at that position, not zero)");
    S.projGaps.slice(0,25).forEach(function(g){
      L.push("  " + playerName(g.pid) + " (" + g.pos + ") had no published projection, using " + num(g.value,1));
    });
    L.push("");
  }

  var odds=playoffOdds();
  if(odds){
    L.push("PLAYOFF ODDS (5000 simulations, top "+odds.spots+" advance, "+odds.weeksLeft+" weeks left)");
    odds.rows.slice().sort(function(a,b){ return b.playoffs-a.playoffs; }).forEach(function(r){
      L.push(teamName(r.rid)+": "+Math.round(r.playoffs*100)+"% playoffs, "+Math.round(r.topSeed*100)+"% top seed");
    });
    L.push("");
  }


  L.push("WAIVER CLAIMS, NEWEST FIRST (winning bid first, then losing bids)");
  S.claims.slice(0,25).forEach(function(c){
    var parts=c.bids.map(function(b){
      return teamName(b.roster)+" $"+b.amount+(b.won?" WON":" lost");
    });
    L.push("Week "+c.week+": "+playerName(c.pid)+(playerMeta(c.pid)?" ("+playerMeta(c.pid)+")":"")
      +" -- "+parts.join("; "));
  });
  L.push("");

  var trades=S.transactions.filter(function(t){ return t.type==="trade"&&t.status==="complete"; });
  if(trades.length){
    L.push("TRADES");
    trades.forEach(function(t){
      var lines=[];
      (t.roster_ids||[]).forEach(function(rid){
        var gets=[];
        if(t.adds) Object.keys(t.adds).forEach(function(pid){ if(t.adds[pid]===rid) gets.push(playerName(pid)); });
        (t.draft_picks||[]).forEach(function(p){ if(p.owner_id===rid) gets.push(p.season+" round "+p.round+" pick"); });
        lines.push(teamName(rid)+" gets "+(gets.join(", ")||"nothing"));
      });
      L.push("Week "+t._week+": "+lines.join(" | "));
    });
    L.push("");
  }

  var fa=S.transactions.filter(function(t){ return t.type==="free_agent"&&t.status==="complete"; }).slice(0,20);
  if(fa.length){
    L.push("RECENT FREE AGENT MOVES");
    fa.forEach(function(t){
      var a=[],d=[];
      if(t.adds) Object.keys(t.adds).forEach(function(pid){ a.push(playerName(pid)+" to "+teamName(t.adds[pid])); });
      if(t.drops) Object.keys(t.drops).forEach(function(pid){ d.push(playerName(pid)+" from "+teamName(t.drops[pid])); });
      L.push("Week "+t._week+": added "+(a.join(", ")||"none")+"; dropped "+(d.join(", ")||"none"));
    });
  }

  L.push(currentWeekPlayers());
  L.push(stillToPlay());
  L.push(editorialContext());

  var pr = powerRows();
  if(pr){
    var apb = allPlay();
    L.push("POWER RANKINGS");
    L.push("Rating is 45% all-play record, 25% season scoring, 15% the last three weeks, 15% strength");
    L.push("of schedule. Schedule faced is the average season scoring of the opponents that team drew,");
    L.push("so a hard slate earns credit instead of just being bad luck. Start/sit is shown but is NOT");
    L.push("in the rating, because points scored already counts what a bad lineup cost.");
    L.push("(rank, team, rating, all-play, points per week, last 3, schedule faced, start/sit)");
    pr.forEach(function(r,i){
      var a = apb[r.id]||{w:0,l:0};
      L.push((i+1)+". "+teamName(r.id)+" -- "+num(r.score,1)
        +", all-play "+a.w+"-"+a.l
        +", "+num(r.avg,1)+" per week"
        +", last 3 "+num(r.recent,1)
        +", faced "+num(r.sos,1)
        +", start/sit "+(r.eff==null?"n/a":Math.round(r.eff*100)+"%"));
    });
    L.push("");
    L.push("USING THE RANKINGS");
    L.push("The rankings are the desk's shared read on who is real and who is not. Use them as a frame");
    L.push("-- contenders, pretenders, live underdogs -- rather than something to quote back at the");
    L.push("reader. \"Nobody in the top three wants to draw them in December\" is the register.");
    L.push("\"The first-ranked team will beat the twelfth\" is not: that is the table read aloud.");
    L.push("An analyst who disagrees with the rankings should say so and say why. The disagreement is");
    L.push("the interesting part, and it goes on their record either way.");
    L.push("");
    L.push("BALLOTS");
    L.push("Every analyst files a full ranking of all "+S.rosters.length+" teams in news.json under");
    L.push("poll.ballots, each entry {analyst, ranking:[team names, best first], comment}. The page");
    L.push("scores them automatically against the power rankings above and keeps them permanently.");
    L.push("Ballots are opinions: they should disagree with the table, and with each other, wherever");
    L.push("that analyst genuinely would. A ballot that matches the table exactly is a wasted ballot.");
    L.push("");
  }

  L.push("HOW MANY ANALYSTS PER STORY");
  L.push("Three is the normal number. Give the lead story all of them, give the small ones two or");
  L.push("three, and vary who appears where. Across a full edition every analyst has to turn up at");
  L.push("least once, and nobody should appear in every single story -- a desk where all five react");
  L.push("to everything reads like a form being filled in rather than a newsroom. Pick the analysts a");
  L.push("story actually earns: the numbers story wants Crimes, the grudge wants Smith, and a story");
  L.push("about somebody getting humiliated does not need a measured second opinion.");
  L.push("");

  var rivs = rivalryThisWeek();
  if(rivs.length && S.history){
    rivs.forEach(function(r){
      var games = headToHead(r._a, r._b, S.history);
      var sm = h2hSummary(games);
      var nA = managerLabel(r._a, S.history), nB = managerLabel(r._b, S.history);
      L.push("NAMED RIVALRY ON THIS WEEK'S SCHEDULE: " + r.name);
      L.push(nA + " vs " + nB + (r.blurb ? " -- " + r.blurb : ""));
      if(sm){
        L.push("All time: " + nA + " " + sm.w + "-" + sm.l + (sm.t ? "-" + sm.t : "")
          + ", " + num(sm.pfA,1) + " to " + num(sm.pfB,1)
          + ", average margin " + num(Math.abs(sm.avg),1)
          + " to " + (sm.avg >= 0 ? nA : nB)
          + (sm.streak > 1 ? ", " + (sm.dir === "A" ? nA : nB) + " has won the last " + sm.streak : ""));
        games.slice(-6).forEach(function(g){
          L.push("  " + g.season + " week " + g.week + ": " + num(g.a,1) + "-" + num(g.b,1)
            + " " + (g.a > g.b ? nA : nB) + (g.playoff ? " (playoff)" : ""));
        });
      } else {
        L.push("They have never played before. This is the first one.");
      }
      L.push("This matchup has a name for a reason. Use it, and use the history, but do not");
      L.push("explain the backstory to the reader as if they have never heard it.");
      L.push("");
    });
  }

  L.push("THE DESK");
  L.push("These are the only analyst keys news.json may use. Keep the voices apart -- if two");
  L.push("takes could swap bylines without anyone noticing, they are not doing their job.");
  Object.keys(ANALYSTS).forEach(function(k){
    var a=ANALYSTS[k];
    L.push("  "+k+" -- "+a.name+" ("+a.role+")");
    if(a.brief) L.push("      "+a.brief);
  });
  L.push("");
  L.push("Not every analyst has to appear in every story, but across an edition each of them");
  L.push("should turn up somewhere.");
  if(ANALYSTS.wildcard){
    L.push(ANALYSTS.wildcard.name + " is the exception that proves the format: he gets the same");
    L.push("ballot and the same column inches as everyone else, and the ballot scoring is what");
    L.push("settles whether he deserved them. Do not soften him into a merely contrarian take,");
    L.push("and never have the others stop to explain the joke.");
  }
  L.push("");

  L.push("HOW TO USE THIS");
  L.push("Work out what actually changed since the previous edition first, then continue existing");
  L.push("storylines, then check whether any earlier take can now be judged, then look for new stories.");
  L.push("Do not manufacture continuity and do not rerun last week's article unless the evidence moved.");
  L.push("Every factual claim must come from this briefing. Analysts may exaggerate what the facts mean;");
  L.push("they may not invent facts.");

  return L.join("\n");
}

/* Export the exact projections the draft card is using, so they can be
   committed as draft-projections.json and never change again. */
function copyBriefing(){
  var btn=$("copyBriefing"), text=briefingText();
  function done(ok){
    btn.textContent = ok ? "Copied. Paste it to your writer." : "Copy failed, see the box below";
    if(!ok){
      var pre=document.createElement("textarea");
      pre.value=text;
      pre.style.cssText="width:100%;height:260px;margin-top:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:10px;font-size:12px";
      btn.parentNode.appendChild(pre);
      pre.select();
    }
    setTimeout(function(){ btn.textContent="Copy this week\u2019s briefing"; },4000);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){done(true);},function(){done(false);});
  } else { done(false); }
}

function renderWeek(){
  var rows=S.matchups[S.week]||[], groups={};
  rows.forEach(function(m){
    var k=m.matchup_id==null?("bye"+m.roster_id):m.matchup_id;
    (groups[k]=groups[k]||[]).push(m);
  });
  var keys=Object.keys(groups);
  if(!keys.length){
    $("tab-week").innerHTML='<h2>Week '+S.week+'</h2><div class="msg">No matchups posted yet for this week.</div>';
    return;
  }
  keys.sort(function(a,b){
    var sa=groups[a].reduce(function(t,m){return t+(Number(m.points)||0);},0);
    var sb=groups[b].reduce(function(t,m){return t+(Number(m.points)||0);},0);
    return sb-sa;
  });
  var html='<h2>Week '+S.week+'</h2><p class="note">Scores update live during games.</p><div class="board">';
  keys.forEach(function(k){
    var g=groups[k];
    if(g.length===1){ html+='<div class="game">'+sideHTML(g[0],true)+'<div class="gap">No opponent this week.</div></div>'; return; }
    var a=g[0],b=g[1],pa=Number(a.points)||0,pb=Number(b.points)||0;
    var lead=pa===pb?"Tied":teamName(pa>pb?a.roster_id:b.roster_id)+" by "+num(Math.abs(pa-pb));
    var pr=projLine(a,b);
    html+='<div class="game">'+sideHTML(a,pa>=pb)+sideHTML(b,pb>=pa)
      +'<div class="gap">'+esc(lead)+(pr?' &nbsp;&middot;&nbsp; '+esc(pr):'')+'</div></div>';
  });
  $("tab-week").innerHTML=html+'</div>';
}
/* Projected total for a side, using whoever is actually in the lineup. */
function projFor(m){
  var PJ = projections();
  if(!PJ) return null;
  var ids=m.starters&&m.starters.length?m.starters:(m.players||[]);
  if(!ids.length) return null;
  var t=0,n=0;
  ids.forEach(function(pid){
    if(!pid||pid==="0") return;
    var v=PJ[pid];
    if(v!=null){ t+=v; n++; }
  });
  return n?t:null;
}
function projLine(a,b){
  if(S.projWeek!==S.week) return "";
  var pa=projFor(a), pb=projFor(b);
  if(pa==null||pb==null) return "";
  return "Projected " + num(pa,1) + " to " + num(pb,1);
}

function sideHTML(m,leading){
  var av=avatar(m.roster_id);
  return '<div class="side'+(leading?' lead':'')+'">'
    +(av?'<img class="av" src="'+esc(av)+'" alt="" loading="lazy">':'<div class="av"></div>')
    +'<div><div class="tname">'+esc(teamName(m.roster_id))+'</div>'
    +'<div class="mgr">'+esc(manager(m.roster_id))+'</div></div>'
    +'<div class="pts">'+num(m.points)+'</div></div>';
}

function effCell(rid){

function renderStandings(){
  var ap=allPlay();
  var rows=S.rosters.map(function(r){
    var st=r.settings||{};
    var w=Number(st.wins)||0,l=Number(st.losses)||0,t=Number(st.ties)||0,games=w+l+t;
    var a=ap[r.roster_id]||{w:0,games:0};
    var pct=a.games?a.w/a.games:0;
    return {id:r.roster_id,w:w,l:l,t:t,
      pf:pts(st.fpts,st.fpts_decimal), pa:pts(st.fpts_against,st.fpts_against_decimal),
      expected:pct*games, luck:w-pct*games};
  }).sort(function(a,b){ return b.w-a.w||b.pf-a.pf||a.l-b.l; });

  var html='<h2>Standings</h2>'

/* ============================================================
   SCHEDULE + EFFICIENCY
   ============================================================ */
function schedulesByWeek(){
  var out={};
  Object.keys(S.matchups).forEach(function(w){
    var g={};
    (S.matchups[w]||[]).forEach(function(m){
      if(m.matchup_id==null) return;
      (g[m.matchup_id]=g[m.matchup_id]||[]).push(m.roster_id);
    });
    var map={};
    Object.keys(g).forEach(function(k){
      var p=g[k];
      if(p.length===2){ map[p[0]]=p[1]; map[p[1]]=p[0]; }
    });
    if(Object.keys(map).length) out[w]=map;
  });
  return out;
}

function scoresByWeek(){
  var out={};
  Object.keys(S.matchups).forEach(function(w){
    if(Number(w)>S.finalWeek) return;
    var any=false, map={};
    (S.matchups[w]||[]).forEach(function(m){
      var p=Number(m.points)||0;
      map[m.roster_id]=p;
      if(p>0) any=true;
    });
    if(any) out[w]=map;
  });
  return out;
}

/* What each team actually scored versus the most they could have. */
function computeEfficiency(){
  if(!S.players){ S.eff=null; return; }
  var slots=(S.league&&S.league.roster_positions)||[];
  if(!slots.length){ S.eff=null; return; }

  var eff={};
  S.rosters.forEach(function(r){ eff[r.roster_id]={actual:0,optimal:0,weeks:[]}; });

  Object.keys(S.matchups).forEach(function(w){
    if(Number(w)>S.finalWeek) return;
    (S.matchups[w]||[]).forEach(function(m){
      var e=eff[m.roster_id];
      if(!e) return;
      var pp=m.players_points||{};
      var ids=(m.players&&m.players.length)?m.players:Object.keys(pp);
      if(!ids.length) return;
      var best=optimalLineup(ids,pp,slots,S.players);
      if(!best||!best.points) return;
      var actual=Number(m.points)||0;
      e.actual+=actual;
      e.optimal+=best.points;
      e.weeks.push({week:Number(w),actual:actual,optimal:best.points,lineup:best.lineup});
    });
  });

  Object.keys(eff).forEach(function(k){
    var e=eff[k];
    e.pct=e.optimal?e.actual/e.optimal:null;
    e.lost=e.optimal-e.actual;
  });
  S.eff=eff;
}

   ARCHIVE — past editions, so the newsroom has a memory

function bust(u){ return u + (u.indexOf("?")<0?"?":"&") + "t=" + Date.now(); }

function loadArchive(){
  if(S.archivePromise) return S.archivePromise;
  S.archivePromise = fetch(bust(ARCHIVE_URL+"index.json"),{cache:"no-store"})
    .then(function(r){
      if(!r.ok) throw new Error("no archive index (" + r.status + ")");
      return r.json();
    })
    .then(function(idx){
      var eds = (idx && idx.editions) || [];
      eds = eds.slice(-12);
      return Promise.all(eds.map(function(e){
        var file = typeof e === "string" ? e : e.file;
        if(!file) return null;
        return fetch(bust(ARCHIVE_URL+file),{cache:"no-store"})
          .then(function(r){ return r.ok?r.json():null; })
          .catch(function(){ return null; })
          .then(function(doc){
            if(!doc) return null;
            if(typeof e === "object"){
              if(doc.week==null && e.week!=null) doc.week = e.week;
              if(!doc.generated && e.generated) doc.generated = e.generated;
            }
            return doc;
          });
      }));
    })
    .then(function(list){
      S.archive = list.filter(Boolean).sort(function(a,b){ return (a.week||0)-(b.week||0); });
      S.archiveError = null;
      return S.archive;
    })
    .catch(function(e){
      S.archive = [];
      S.archiveError = e.message || String(e);
      return S.archive;
    });
  return S.archivePromise;
}

/* Current edition plus every archived one, oldest first. An archived copy of
   the edition that is still on the front page would otherwise be counted
   twice, so match on week and headline and keep the live one. */
function allEditions(){
  var out = (S.archive || []).slice();
  if(S.news){
    var key = editionKey(S.news);
    out = out.filter(function(e){ return editionKey(e) !== key; });
    out.push(S.news);
  }
  return out;
}
function editionKey(ed){
  if(!ed) return "";
  var first = (ed.stories && ed.stories[0] && ed.stories[0].headline) || "";
  return (ed.week==null?"?":ed.week) + "|" + first;
}

/* Where each team actually sits right now. */
function actualRankMap(){

  var rows = S.rosters.map(function(r){
    var st = r.settings||{};
    return {rid:r.roster_id, w:Number(st.wins)||0, pf:pts(st.fpts,st.fpts_decimal)};
  }).sort(function(a,b){ return b.w-a.w || b.pf-a.pf; });

/* ============================================================
   PROJECTIONS
   ============================================================ */
function scoringKey(){
  var ss=(S.league&&S.league.scoring_settings)||{};
  var rec=Number(ss.rec)||0;
  if(rec>=1) return "pts_ppr";
  if(rec>0)  return "pts_half_ppr";
  return "pts_std";
}

/* Sleeper's pts_ppr has standard four-point passing touchdowns baked into it.
   This league pays six, so leaning on pts_ppr quietly understates every
   quarterback by three or four points a week -- which then leaks into optimal
   lineups, playoff odds and the draft report card. Score the raw projected
   stat line against the league's own scoring_settings instead.

   Two positions opt out. Defensive scoring is bucketed (pts_allow_0,
   yds_allow_350_399 and friends are flags, not counting stats, so multiplying
   them is meaningless) and kicker scoring here is close enough to standard
   that the feed's own number is the safer bet. Both keep pts_ppr. */
var PROJ_BUCKET = /^(pts_allow|yds_allow)_/;
var PROJ_SANITY_MAX = 80;   // nobody projects for 80; if we get there, we are wrong

function projPositionOf(row, pid){
  var p = row.player || (S.players && S.players[pid]);
  if(!p) return null;
  if(p.position) return p.position;
  if(p.fantasy_positions && p.fantasy_positions.length) return p.fantasy_positions[0];
  return null;
}

function customProjection(st, pos){
  var ss = (S.league && S.league.scoring_settings) || null;
  if(!ss || !pos || pos === "DEF" || pos === "K") return null;
  var total = 0, matched = 0;
  for(var k in ss){
    if(!Object.prototype.hasOwnProperty.call(ss, k)) continue;
    if(PROJ_BUCKET.test(k)) continue;
    var w = Number(ss[k]);
    if(!w) continue;                       // not scored in this league
    if(st[k] == null) continue;            // not projected for this player
    var v = Number(st[k]);
    if(!isFinite(v)) continue;
    total += v * w; matched++;
  }
  if(!matched) return null;
  if(!isFinite(total) || total < 0 || total > PROJ_SANITY_MAX) return null;
  return total;
}

/* Turn a raw projection feed into {player_id: points}. Every player that can
   be scored from the league's settings is; the rest fall back to the feed's
   own number, so a change in Sleeper's stat keys degrades to today's
   behaviour instead of emptying the page. */
function projMapFrom(list){
  var key = scoringKey(), map = {}, n = 0, custom = 0;
  list.forEach(function(row){
    var pid = row.player_id || (row.player && row.player.player_id);
    if(!pid) return;
    var st = row.stats || {};
    var v = customProjection(st, projPositionOf(row, pid));
    if(v != null){ custom++; }
    else {
      v = st[key];
      if(v == null) v = st.pts_ppr;
      if(v == null) v = st.pts_std;
    }
    if(v == null) return;
    map[pid] = Number(v) || 0; n++;
  });
  if(!n) throw new Error("no usable point values in the projection feed");
  S.projScored = custom + " of " + n + " scored from league settings";
  return map;
}

/* A player with no published projection at all is an unknown, not a zero.
   fillProjectionGaps substitutes a replacement-level number at his position;
   this shares one filled map across every caller instead of each one deciding
   for itself. */
function projections(){
  if(!S.projections) return null;
  if(S.projFilledFrom === S.projections) return S.projFilled;
  if(!S.players || !S.rosters || !S.rosters.length) return S.projections;
  var all = [];
  S.rosters.forEach(function(r){ (r.players||[]).forEach(function(pid){ all.push(pid); }); });
  var fix = fillProjectionGaps(S.projections, S.players, all);
  S.projFilled = fix.map;
  S.projFilledFrom = S.projections;
  S.projGaps = fix.filled;
  return S.projFilled;
}

function projectionsFor(week){
  var season = S.league && S.league.season;
  if(!season) return Promise.resolve(null);
  var url = PROJ_API+"/projections/nfl/"+season+"/"+week+"?season_type=regular&order_by=ppr";
  return fetch(url)
    .then(function(r){ if(!r.ok) throw new Error("projections returned "+r.status); return r.json(); })
    .then(function(list){
      if(!list||!list.length) throw new Error("projections came back empty");
      return projMapFrom(list);
    });
}

function loadBookProjections(){
  S.bookWeek = bookWeekNumber();
  if(S.bookWeek === S.week){
    S.bookProjections = S.projections;
    return Promise.resolve();
  }
  return projectionsFor(S.bookWeek)
    .then(function(map){ S.bookProjections = map; })
    .catch(function(){ S.bookProjections = null; });
}

function loadProjections(){
  var week=S.week, season=S.league&&S.league.season;
  if(!season) return Promise.resolve();
  S.projWeek=week;
  var url=PROJ_API+"/projections/nfl/"+season+"/"+week+"?season_type=regular&order_by=ppr";
  return fetch(url)
    .then(function(r){
      if(!r.ok) throw new Error("projections returned "+r.status);
      return r.json();
    })
    .then(function(list){
      if(!list||!list.length) throw new Error("projections came back empty");
      S.projections=projMapFrom(list);
      S.projFilled=null; S.projFilledFrom=null;
      S.projError=null;
    })
    .catch(function(e){
      S.projections=null;
      S.projError=e.message||String(e);
    });
}

/* What each roster's best lineup projects for, before anything is played. */
function projectedStrength(projMap){
  var proj = projMap || S.projections;
  if(!proj||!S.players) return null;
  var slots=(S.league&&S.league.roster_positions)||[];
  if(!slots.length) return null;

  // A player with no published projection must not be treated as a zero.
  if(projMap){
    var all=[];
    S.rosters.forEach(function(r){ (r.players||[]).forEach(function(p){ all.push(p); }); });
    proj = fillProjectionGaps(proj, S.players, all).map;
  } else {
    proj = projections() || proj;
  }

  var out={};
  S.rosters.forEach(function(r){
    var ids=r.players||[];
    if(!ids.length) return;
    var best=optimalLineup(ids,proj,slots,S.players);
    if(best&&best.points) out[r.roster_id]=best.points;
  });
  return Object.keys(out).length?out:null;
}

/* ============================================================
   PLAYOFF ODDS
   ============================================================ */
function playoffOdds(){
  var scores=scoresByWeek(), sched=schedulesByWeek();
  var perTeam={};
  S.rosters.forEach(function(r){ perTeam[r.roster_id]=[]; });
  Object.keys(scores).forEach(function(w){
    Object.keys(scores[w]).forEach(function(rid){
      if(perTeam[rid]) perTeam[rid].push(scores[w][rid]);
    });
  });

  var proj=projectedStrength();
  var played=0;
  S.rosters.forEach(function(r){ played=Math.max(played,(perTeam[r.roster_id]||[]).length); });

  // Nothing to go on at all.
  if(!proj && played<2) return null;

  var all=[];
  Object.keys(perTeam).forEach(function(k){ all=all.concat(perTeam[k]); });
  var leagueSd=meanSd(all).sd;

  var teams=S.rosters.map(function(r){
    var st=r.settings||{};
    var list=perTeam[r.roster_id]||[];
    var ms=meanSd(list);
    var p=proj?proj[r.roster_id]:null;
    var mean=blendMean(ms.mean,list.length,p!=null?p:null);
    var sd;
    if(list.length>=3&&ms.sd>0) sd=ms.sd;
    else if(leagueSd>0) sd=leagueSd;
    else sd=Math.max(18,mean*0.20);      // typical weekly spread when nothing is known
    return {
      rid:r.roster_id,
      wins:(Number(st.wins)||0)+(Number(st.ties)||0)*0.5,
      pts:pts(st.fpts,st.fpts_decimal),
      mean:mean, sd:sd
    };
  });

  var remaining=[];
  for(var w=S.finalWeek+1; w<=S.regWeeks; w++){
    if(!sched[w]) continue;
    var seen={}, pairs=[];
    Object.keys(sched[w]).forEach(function(a){
      var b=sched[w][a];
      var key=Math.min(a,b)+"-"+Math.max(a,b);
      if(seen[key]) return;
      seen[key]=1;
      pairs.push([Number(a),Number(b)]);
    });
    if(pairs.length) remaining.push({week:w,pairs:pairs});
  }

  var spots=(S.league.settings&&S.league.settings.playoff_teams)||6;
  var res=simulateSeason({teams:teams,schedule:remaining,playoffSpots:spots,runs:5000});
  var meanBy={};
  teams.forEach(function(t){ meanBy[t.rid]=t; });
  return {rows:res, weeksLeft:remaining.length, spots:spots,
          basis:(proj?(played>=2?"blend":"projection"):"scores"), teams:meanBy, played:played};
}

/* ============================================================
   POWER TAB
   ============================================================ */

/* Season scoring average per roster. */
function seasonAverages(scores){
  var avg={};
  Object.keys(scores).forEach(function(rid){
    var l=scores[rid]||[];
    avg[rid]= l.length ? l.reduce(function(t,s){ return t+s.points; },0)/l.length : 0;
  });
  return avg;
}

/* How hard a slate each team has actually faced: the average season scoring of
   the opponents they were scheduled against, over the weeks they have played.

   All-play already ignores the schedule. This does something different -- it
   pays a team back for having drawn the hard weeks. Losing by five to the
   highest scorer in the league is not the same week as losing by five to the
   worst, and a win-loss record cannot tell those two apart. */
function strengthOfSchedule(scores, sched){
  var avg=seasonAverages(scores), out={};
  S.rosters.forEach(function(r){
    var rid=r.roster_id, faced=[];
    (scores[rid]||[]).forEach(function(s){
      var opp = sched[s.week] && sched[s.week][rid];
      if(opp!=null && avg[opp]) faced.push(avg[opp]);
    });
    out[rid] = faced.length ? faced.reduce(function(t,v){ return t+v; },0)/faced.length : null;
  });
  return out;
}

var POWER_WEIGHTS = { allPlay:0.45, scoring:0.25, recent:0.15, sos:0.15 };

/* The ranking itself, best first. Shared by the tab, the ballot scoring and
   the briefing, so all three can never drift out of agreement. */
function powerRows(){
  var scores=weeklyScores(), ap=allPlay(), sos=strengthOfSchedule(scores, schedulesByWeek());
  var rows=S.rosters.map(function(r){
    var list=scores[r.roster_id]||[];
    var avg=list.length?list.reduce(function(t,s){return t+s.points;},0)/list.length:0;
    var rl=list.slice(-3);
    var recent=rl.length?rl.reduce(function(t,s){return t+s.points;},0)/rl.length:0;
    var a=ap[r.roster_id]||{w:0,games:0};
    var e=S.eff&&S.eff[r.roster_id];
    return {id:r.roster_id, apPct:a.games?a.w/a.games:0, avg:avg, recent:recent,
            sos:sos[r.roster_id], eff:(e&&e.pct!=null)?e.pct:null, played:list.length};
  });
  if(!rows.some(function(r){ return r.played; })) return null;

  // A team with no resolvable opponents yet sits at the league average rather
  // than at zero, which would otherwise read as the easiest schedule alive.
  var sosVals=rows.map(function(r){ return r.sos; }).filter(function(v){ return v!=null; });
  var sosAvg=sosVals.length?sosVals.reduce(function(t,v){return t+v;},0)/sosVals.length:0;
  rows.forEach(function(r){ if(r.sos==null) r.sos=sosAvg; });

  function norm(key){
    var vals=rows.map(function(r){ return r[key]; });
    var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), span=hi-lo;
    rows.forEach(function(r){ r["n_"+key]=span?(r[key]-lo)/span:0.5; });
  }
  norm("apPct"); norm("avg"); norm("recent"); norm("sos");
  rows.forEach(function(r){
    r.score=100*(POWER_WEIGHTS.allPlay*r.n_apPct + POWER_WEIGHTS.scoring*r.n_avg
               + POWER_WEIGHTS.recent*r.n_recent + POWER_WEIGHTS.sos*r.n_sos);
  });
  rows.sort(function(a,b){ return b.score-a.score; });
  return rows;
}

/* {roster_id: rank} off the power rankings. This is what analyst ballots are
   graded against -- they are predicting the rankings, not the standings, and
   the standings are half schedule luck anyway. */
function powerRankMap(){
  var rows=powerRows();
  if(!rows) return null;
  var map={};
  rows.forEach(function(r,i){ map[r.id]=i+1; });
  return map;
}

/* ============================================================
   THE DESK -- who these people are, and how often they are right
   ============================================================ */
function analystRecord(){
  var actual=powerRankMap(), out={};
  Object.keys(ANALYSTS).forEach(function(k){
    out[k]={ballots:0, sum:0, pairwise:null, best:null, worst:null};
  });
  if(!actual) return out;
  allEditions().forEach(function(ed){
    if(!ed||!ed.poll||!ed.poll.ballots) return;
    ed.poll.ballots.forEach(function(b){
      var rec=out[b.analyst];
      if(!rec||!b.ranking||!b.ranking.length) return;
      var ids=b.ranking.map(function(nm){ return resolveTeam(nm); }).filter(function(x){ return x!=null; });
      var sc=scoreRanking(ids, actual);
      if(!sc) return;
      rec.ballots++; rec.sum+=sc.pairwise;
      if(!rec.best ||sc.pairwise>rec.best.pairwise)  rec.best=sc;
      if(!rec.worst||sc.pairwise<rec.worst.pairwise) rec.worst=sc;
    });
  });
  Object.keys(out).forEach(function(k){
    var r=out[k]; r.pairwise = r.ballots ? r.sum/r.ballots : null;
  });
  return out;
}

function projectedHTML(){
  var o=playoffOdds();
  var preseason=!S.finalWeek;
  var heading=preseason?'Preseason power rankings':'Projected finish';
  var h='<h2 style="margin-top:34px">'+heading+'</h2>';
  if(!o){
    return h+'<div class="msg">'
      +(S.projError
        ? 'Projections are not available right now, and no games have been played yet, so there is nothing to project from.'
        : 'Nothing to project from yet.')
      +'</div>';
  }

  // Expected wins comes straight out of the same simulation.
  var scores=scoresByWeek(), sched=schedulesByWeek();
  var teams=o.teams;
  var remaining=0;
  for(var w=S.finalWeek+1; w<=S.regWeeks; w++){ if(sched[w]) remaining++; }

  var rows=S.rosters.map(function(r){
    var st=r.settings||{};
    var t=teams[r.roster_id]||{mean:0,sd:0};
    var wins=Number(st.wins)||0, losses=Number(st.losses)||0, ties=Number(st.ties)||0;
    // Chance of beating a league-average opponent, week to week.
    var others=S.rosters.filter(function(x){ return x.roster_id!==r.roster_id; })
      .map(function(x){ return (teams[x.roster_id]||{mean:0}).mean; });
    var oppMean=others.length?others.reduce(function(a,b){return a+b;},0)/others.length:t.mean;
    var oppSd=t.sd;
    var z=(t.mean-oppMean)/Math.sqrt(Math.max(1e-6,t.sd*t.sd+oppSd*oppSd));
    var pWin=0.5*(1+erf(z/Math.SQRT2));
    var projWins=wins+pWin*remaining;
    return {rid:r.roster_id, mean:t.mean, wins:wins, losses:losses, ties:ties,
            pWin:pWin, projWins:projWins, projLosses:(wins+losses+ties)+remaining-projWins};
  }).sort(function(a,b){ return b.projWins-a.projWins||b.mean-a.mean; });

  var label = o.basis==="projection"
    ? 'Nothing has been played, so this is purely roster talent on paper: the best lineup each team could start, simulated across the full season.'
    : (o.basis==="blend"
        ? 'Blends what each team has actually scored with what their roster projects. The real scores take over as the season goes on.'
        : 'Built from scoring so far. Projections were unavailable, so rosters are not being read directly.');

  h+='<p class="note">'+label+' Weekly projection is the best lineup each roster could start this week.</p>';
  h+='<div class="scroll"><table><thead><tr><th></th><th>Team</th><th>Projected record</th>'
    +'<th>Weekly projection</th><th>Win chance per week</th><th>Now</th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    var cls=r.pWin>=0.58?"pos":(r.pWin<=0.42?"neg":"");
    h+='<tr class="rank-'+(i+1)+'"><td>'+(i+1)+'</td><td>'+teamCell(r.rid)+'</td>'
      +'<td>'+num(r.projWins,1)+'-'+num(r.projLosses,1)+'</td>'
      +'<td>'+num(r.mean,1)+'</td>'
      +'<td class="'+cls+'">'+Math.round(r.pWin*100)+'%</td>'
      +'<td>'+r.wins+'-'+r.losses+(r.ties?'-'+r.ties:'')+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}

/* Abramowitz and Stegun 7.1.26, plenty accurate for a win probability. */
function erf(x){
  var s=x<0?-1:1; x=Math.abs(x);
  var a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  var t=1/(1+p*x);
  var y=1-((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return s*y;
}

function oddsHTML(){
  var h='<h2 style="margin-top:34px">Playoff odds</h2>';
  var o=playoffOdds();
  if(!o){
    return h+'<p class="note">Needs at least two completed weeks of scoring for every team.</p>'
      +'<div class="msg">Not enough games yet to simulate.</div>';
  }
  h+='<p class="note">Five thousand simulations of the '+o.weeksLeft+' week'+(o.weeksLeft===1?'':'s')
    +' left. Top '+o.spots+' make it. '
    +(o.basis==="projection"?'Team strength is coming from projections only, so treat these as opening lines.'
      :(o.basis==="blend"?'Team strength blends real scoring with roster projections.'
        :'Team strength comes from scoring so far.'))+'</p>';
  var rows=o.rows.slice().sort(function(a,b){ return b.playoffs-a.playoffs||b.topSeed-a.topSeed; });
  h+='<div class="scroll"><table><thead><tr><th></th><th>Team</th><th>Playoff odds</th><th>Top seed</th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    var pctCls=r.playoffs>=0.75?"pos":(r.playoffs<=0.15?"neg":"");
    h+='<tr class="rank-'+(i+1)+'"><td>'+(i+1)+'</td><td>'+teamCell(r.rid)+'</td>'
      +'<td class="'+pctCls+'">'+pct(r.playoffs)+'</td><td>'+pct(r.topSeed)+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}
function pct(x){
  if(x>=0.999) return ">99%";
  if(x<=0.001&&x>0) return "<1%";
  return Math.round(x*100)+"%";
}

function swapHTML(){
  var scores=scoresByWeek(), sched=schedulesByWeek();
  var weeks=Object.keys(scores).length;
  var h='<h2 style="margin-top:34px">Schedule swap</h2>';
  if(weeks<2){
    return h+'<div class="msg">Needs a couple of completed weeks before swapping schedules means anything.</div>';
  }
  var swap=scheduleSwap(scores,sched);
  h+='<p class="note">Your exact scores, replayed against every other team&rsquo;s slate. The best and worst columns name whose schedule would have done it.</p>';
  h+='<div class="scroll"><table><thead><tr><th></th><th>Team</th><th>Actual</th><th>Best case</th><th>Worst case</th><th>Average wins</th></tr></thead><tbody>';

  var rows=S.rosters.map(function(r){
    var me=swap[r.roster_id]||{};
    var own=me[r.roster_id]||{w:0,l:0,t:0};
    var best=null,worst=null,total=0,n=0;
    Object.keys(me).forEach(function(owner){
      var rec=me[owner];
      total+=rec.w; n++;
      if(!best||rec.w>best.rec.w) best={owner:Number(owner),rec:rec};
      if(!worst||rec.w<worst.rec.w) worst={owner:Number(owner),rec:rec};
    });
    return {rid:r.roster_id, own:own, best:best, worst:worst, avg:n?total/n:0};
  }).sort(function(a,b){ return b.avg-a.avg; });

  rows.forEach(function(r,i){
    function rec(x){ return x?x.rec.w+"-"+x.rec.l+(x.rec.t?"-"+x.rec.t:""):"--"; }
    var bTag=r.best&&r.best.owner!==r.rid?'<div class="mgr">'+esc(teamName(r.best.owner))+'</div>':'';
    var wTag=r.worst&&r.worst.owner!==r.rid?'<div class="mgr">'+esc(teamName(r.worst.owner))+'</div>':'';
    h+='<tr class="rank-'+(i+1)+'"><td>'+(i+1)+'</td><td>'+teamCell(r.rid)+'</td>'
      +'<td>'+r.own.w+'-'+r.own.l+(r.own.t?'-'+r.own.t:'')+'</td>'
      +'<td>'+rec(r.best)+bTag+'</td>'
      +'<td>'+rec(r.worst)+wTag+'</td>'
      +'<td>'+num(r.avg,1)+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}

/* ============================================================
   THE ONE THAT GOT AWAY
   ============================================================ */
function pointsSince(pid, week){
  var total=0, found=false;
  Object.keys(S.matchups).forEach(function(w){
    if(Number(w)<week||Number(w)>S.finalWeek) return;
    (S.matchups[w]||[]).forEach(function(m){
      var pp=m.players_points||{};
      if(pp[pid]!=null){ total+=Number(pp[pid])||0; found=true; }
    });
  });
  return found?total:null;
}
