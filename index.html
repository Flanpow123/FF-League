function renderPower(){
  var scores=weeklyScores(), ap=allPlay();
  var rows=S.rosters.map(function(r){
    var list=scores[r.roster_id]||[];
    var avg=list.length?list.reduce(function(t,s){return t+s.points;},0)/list.length:0;
    var rl=list.slice(-3);
    var recent=rl.length?rl.reduce(function(t,s){return t+s.points;},0)/rl.length:0;
    var a=ap[r.roster_id]||{w:0,games:0};
    return {id:r.roster_id, apPct:a.games?a.w/a.games:0, avg:avg, recent:recent, played:list.length};
  });

  var ranked = rows.some(function(r){return r.played;});
  var html;

  if(!ranked){
    html='<h2>In-season power rankings</h2><div class="msg">These need games. '
      +'Until week 1 goes final, the preseason rankings below are the ones that count.</div>';
  } else {
    function norm(key){
      var vals=rows.map(function(r){return r[key];});
      var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),span=hi-lo;
      rows.forEach(function(r){ r["n_"+key]=span?(r[key]-lo)/span:0.5; });
    }
    norm("apPct");norm("avg");norm("recent");
    rows.forEach(function(r){ r.score=100*(0.50*r.n_apPct+0.30*r.n_avg+0.20*r.n_recent); });
    rows.sort(function(a,b){ return b.score-a.score; });

    html='<h2>Power rankings</h2>'
    +'<p class="note">Half all-play record, three tenths season scoring, two tenths the last three weeks. Ignores who you happened to be scheduled against.</p>'
    +'<div class="scroll"><table><thead><tr><th></th><th>Team</th><th>Rating</th><th>All-play</th><th>Points per week</th><th>Last 3 weeks</th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    var a=ap[r.id]||{w:0,l:0};
    html+='<tr class="rank-'+(i+1)+'"><td>'+(i+1)+'</td><td>'+teamCell(r.id)+'</td>'
      +'<td>'+num(r.score,1)+'</td><td>'+a.w+'-'+a.l+'</td><td>'+num(r.avg,1)+'</td><td>'+num(r.recent,1)+'</td></tr>';
  });
  html+='</tbody></table></div>';
  }

  html+=projectedHTML()+oddsHTML()+swapHTML();
  $("tab-power").innerHTML=html;
}

function projectedHTML(){
  var o=playoffOdds();
  var preseason=!S.finalWeek;
  var heading=preseason?'Preseason power rankings':'Projected finish';
  var h='<h2 style="margin-top:34px">'+heading+'</h2>';
  if(!o){
    return h+'<div class="msg">'
      +(S.projError
        ? 'Projections are not available right now, and no games have been played yet, so there is nothing to project from.'
        : 'Nothing to project from yet.')
      +'</div>';
  }

  // Expected wins comes straight out of the same simulation.
  var scores=scoresByWeek(), sched=schedulesByWeek();
  var teams=o.teams;
  var remaining=0;
  for(var w=S.finalWeek+1; w<=S.regWeeks; w++){ if(sched[w]) remaining++; }

  var rows=S.rosters.map(function(r){
    var st=r.settings||{};
    var t=teams[r.roster_id]||{mean:0,sd:0};
    var wins=Number(st.wins)||0, losses=Number(st.losses)||0, ties=Number(st.ties)||0;
    // Chance of beating a league-average opponent, week to week.
    var others=S.rosters.filter(function(x){ return x.roster_id!==r.roster_id; })
      .map(function(x){ return (teams[x.roster_id]||{mean:0}).mean; });
    var oppMean=others.length?others.reduce(function(a,b){return a+b;},0)/others.length:t.mean;
    var oppSd=t.sd;
    var z=(t.mean-oppMean)/Math.sqrt(Math.max(1e-6,t.sd*t.sd+oppSd*oppSd));
    var pWin=0.5*(1+erf(z/Math.SQRT2));
    var projWins=wins+pWin*remaining;
    return {rid:r.roster_id, mean:t.mean, wins:wins, losses:losses, ties:ties,
            pWin:pWin, projWins:projWins, projLosses:(wins+losses+ties)+remaining-projWins};
  }).sort(function(a,b){ return b.projWins-a.projWins||b.mean-a.mean; });

  var label = o.basis==="projection"
    ? 'Nothing has been played, so this is purely roster talent on paper: the best lineup each team could start, simulated across the full season.'
    : (o.basis==="blend"
        ? 'Blends what each team has actually scored with what their roster projects. The real scores take over as the season goes on.'
        : 'Built from scoring so far. Projections were unavailable, so rosters are not being read directly.');

  h+='<p class="note">'+label+' Weekly projection is the best lineup each roster could start this week.</p>';
  h+='<div class="scroll"><table><thead><tr><th></th><th>Team</th><th>Projected record</th>'
    +'<th>Weekly projection</th><th>Win chance per week</th><th>Now</th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    var cls=r.pWin>=0.58?"pos":(r.pWin<=0.42?"neg":"");
    h+='<tr class="rank-'+(i+1)+'"><td>'+(i+1)+'</td><td>'+teamCell(r.rid)+'</td>'
      +'<td>'+num(r.projWins,1)+'-'+num(r.projLosses,1)+'</td>'
      +'<td>'+num(r.mean,1)+'</td>'
      +'<td class="'+cls+'">'+Math.round(r.pWin*100)+'%</td>'
      +'<td>'+r.wins+'-'+r.losses+(r.ties?'-'+r.ties:'')+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}

/* Abramowitz and Stegun 7.1.26, plenty accurate for a win probability. */
function erf(x){
  var s=x<0?-1:1; x=Math.abs(x);
  var a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  var t=1/(1+p*x);
  var y=1-((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return s*y;
}

function oddsHTML(){
  var h='<h2 style="margin-top:34px">Playoff odds</h2>';
  var o=playoffOdds();
  if(!o){
    return h+'<p class="note">Needs at least two completed weeks of scoring for every team.</p>'
      +'<div class="msg">Not enough games yet to simulate.</div>';
  }
  h+='<p class="note">Five thousand simulations of the '+o.weeksLeft+' week'+(o.weeksLeft===1?'':'s')
    +' left. Top '+o.spots+' make it. '
    +(o.basis==="projection"?'Team strength is coming from projections only, so treat these as opening lines.'
      :(o.basis==="blend"?'Team strength blends real scoring with roster projections.'
        :'Team strength comes from scoring so far.'))+'</p>';
  var rows=o.rows.slice().sort(function(a,b){ return b.playoffs-a.playoffs||b.topSeed-a.topSeed; });
  h+='<div class="scroll"><table><thead><tr><th></th><th>Team</th><th>Playoff odds</th><th>Top seed</th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    var pctCls=r.playoffs>=0.75?"pos":(r.playoffs<=0.15?"neg":"");
    h+='<tr class="rank-'+(i+1)+'"><td>'+(i+1)+'</td><td>'+teamCell(r.rid)+'</td>'
      +'<td class="'+pctCls+'">'+pct(r.playoffs)+'</td><td>'+pct(r.topSeed)+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}
function pct(x){
  if(x>=0.999) return ">99%";
  if(x<=0.001&&x>0) return "<1%";
  return Math.round(x*100)+"%";
}

function swapHTML(){
  var scores=scoresByWeek(), sched=schedulesByWeek();
  var weeks=Object.keys(scores).length;
  var h='<h2 style="margin-top:34px">Schedule swap</h2>';
  if(weeks<2){
    return h+'<div class="msg">Needs a couple of completed weeks before swapping schedules means anything.</div>';
  }
  var swap=scheduleSwap(scores,sched);
  h+='<p class="note">Your exact scores, replayed against every other team&rsquo;s slate. The best and worst columns name whose schedule would have done it.</p>';
  h+='<div class="scroll"><table><thead><tr><th></th><th>Team</th><th>Actual</th><th>Best case</th><th>Worst case</th><th>Average wins</th></tr></thead><tbody>';

  var rows=S.rosters.map(function(r){
    var me=swap[r.roster_id]||{};
    var own=me[r.roster_id]||{w:0,l:0,t:0};
    var best=null,worst=null,total=0,n=0;
    Object.keys(me).forEach(function(owner){
      var rec=me[owner];
      total+=rec.w; n++;
      if(!best||rec.w>best.rec.w) best={owner:Number(owner),rec:rec};
      if(!worst||rec.w<worst.rec.w) worst={owner:Number(owner),rec:rec};
    });
    return {rid:r.roster_id, own:own, best:best, worst:worst, avg:n?total/n:0};
  }).sort(function(a,b){ return b.avg-a.avg; });

  rows.forEach(function(r,i){
    function rec(x){ return x?x.rec.w+"-"+x.rec.l+(x.rec.t?"-"+x.rec.t:""):"--"; }
    var bTag=r.best&&r.best.owner!==r.rid?'<div class="mgr">'+esc(teamName(r.best.owner))+'</div>':'';
    var wTag=r.worst&&r.worst.owner!==r.rid?'<div class="mgr">'+esc(teamName(r.worst.owner))+'</div>':'';
    h+='<tr class="rank-'+(i+1)+'"><td>'+(i+1)+'</td><td>'+teamCell(r.rid)+'</td>'
      +'<td>'+r.own.w+'-'+r.own.l+(r.own.t?'-'+r.own.t:'')+'</td>'
      +'<td>'+rec(r.best)+bTag+'</td>'
      +'<td>'+rec(r.worst)+wTag+'</td>'
      +'<td>'+num(r.avg,1)+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}

function draftBasisNote(){
  if(S.projections){
    return 'Each player is valued by projected points above the last startable body at his own position, so a quarterback is measured against '
      + 'quarterbacks and a kicker is worth close to nothing whenever he went. That board is matched back onto the picks this league actually spent. '
      + 'Positive means value fell to you, negative means you reached. Players who would not crack your starting lineup count for a third as much, '
      + 'because a steal on your fifth receiver does not win anything.';
  }
  return 'Projections are unavailable, so players are ranked against others at their own position using Sleeper\u2019s ranking. That removes the fake '
    + 'bonus every team gets for waiting on quarterback, but it cannot tell you that a kicker went too early.';
}

function renderDraft(){
  var box=$("tab-draft");
  if(!S.draftPicks||!S.draftPicks.length){
    box.innerHTML='<h2>Draft report card</h2><div class="msg">No draft picks found for this league yet.</div>';
    return;
  }
  if(!S.players){
    box.innerHTML='<h2>Draft report card</h2><div class="msg">Loading the player database, one moment.</div>';
    return;
  }

  var rows=gradeDraft(S.draftPicks,S.players,(S.league&&S.league.roster_positions)||[],S.projections,S.rosters.length);
  if(!rows.length){
    box.innerHTML='<h2>Draft report card</h2><div class="msg">Draft picks came back without team assignments, so they cannot be graded.</div>';
    return;
  }

  var starters=((S.league&&S.league.roster_positions)||[]).filter(function(s){ return s!=="BN"&&s!=="IR"&&s!=="TAXI"; });
  var need={};
  starters.forEach(function(s){ need[s]=(need[s]||0)+1; });

  var html='<h2>Draft report card</h2>'
    +'<p class="note">'+draftBasisNote()+'</p>'
    +'<div class="scroll"><table><thead><tr><th></th><th>Team</th><th>Value per pick</th><th>Best pick</th><th>Worst pick</th><th>Average age</th></tr></thead><tbody>';

  rows.forEach(function(r,i){
    var cls=r.avgValue>3?"pos":(r.avgValue<-3?"neg":"");
    function pk(p){
      if(!p) return "--";
      return '<div>'+esc(playerName(p.pid))+'</div><div class="mgr">'+esc(p.pos)+', pick '+p.pick
        +(p.expected!=null&&p.expected!==p.pick?' vs '+p.expected:'')+', '+(p.value>0?'+':'')+p.value+'</div>';
    }
    html+='<tr class="rank-'+(i+1)+'"><td>'+(i+1)+'</td><td>'+teamCell(r.rid)+'</td>'
      +'<td class="'+cls+'">'+(r.avgValue>0?'+':'')+num(r.avgValue,1)+'</td>'
      +'<td>'+pk(r.best)+'</td><td>'+pk(r.worst)+'</td>'
      +'<td>'+(r.avgAge?num(r.avgAge,1):"--")+'</td></tr>';
  });
  html+='</tbody></table></div>';

  // Roster construction oddities, which need no proxy at all.
  var flags=[];
  rows.forEach(function(r){
    Object.keys(r.positions).forEach(function(pos){
      var have=r.positions[pos], want=need[pos]||0;
      if(pos==="QB"&&want<=1&&have>=3) flags.push(teamName(r.rid)+" drafted "+have+" quarterbacks in a "+(want||1)+"-QB league.");
      if(pos==="K"&&have>=2) flags.push(teamName(r.rid)+" drafted "+have+" kickers, on purpose.");
      if(pos==="DEF"&&have>=3) flags.push(teamName(r.rid)+" drafted "+have+" defenses.");
      if(pos==="TE"&&have>=4) flags.push(teamName(r.rid)+" drafted "+have+" tight ends.");
    });
  });
  var oldest=rows.filter(function(r){return r.avgAge;}).sort(function(a,b){ return b.avgAge-a.avgAge; })[0];
  if(oldest) flags.push("Oldest roster in the league: "+teamName(oldest.rid)+", averaging "+num(oldest.avgAge,1)+" years old.");

  if(flags.length){
    html+='<h2 style="margin-top:34px">Construction notes</h2>'
      +'<p class="note">Straight from the pick list. No proxy, no ranking, just what people did.</p><div class="wire">';
    flags.forEach(function(f){ html+='<div class="wire-item"><div class="dt">'+esc(f)+'</div></div>'; });
    html+='</div>';
  }
  box.innerHTML=html;
}

/* ============================================================
   THE ONE THAT GOT AWAY
   ============================================================ */
function pointsSince(pid, week){
  var total=0, found=false;
  Object.keys(S.matchups).forEach(function(w){
    if(Number(w)<week||Number(w)>S.finalWeek) return;
    (S.matchups[w]||[]).forEach(function(m){
      var pp=m.players_points||{};
      if(pp[pid]!=null){ total+=Number(pp[pid])||0; found=true; }
    });
  });
  return found?total:null;
}

function gotAwayHTML(){
  var contested=S.claims.filter(function(c){ return c.bids.length>1&&c.bids[0].won; });
  if(!contested.length) return "";
  var items=[];
  contested.forEach(function(c){
    var since=pointsSince(c.pid,c.week);
    if(since==null) return;
    var winner=c.bids[0];
    for(var i=1;i<c.bids.length;i++){
      var loser=c.bids[i];
      items.push({
        pid:c.pid, week:c.week, since:since,
        winner:winner, loser:loser, gap:winner.amount-loser.amount
      });
    }
  });
  if(!items.length) return "";
  items.sort(function(a,b){ return b.since-a.since; });

  var h='<h2 style="margin-top:34px">The one that got away</h2>'
    +'<p class="note">Every losing bid, and what the player has scored since the day you would not pay a few more dollars.</p><div class="feed">';
  items.slice(0,20).forEach(function(it){
    h+='<div class="move"><div class="move-top"><span class="kind">Receipt</span>'
      +'<span class="who">Week '+it.week+'</span></div>'
      +playerLine(it.pid)
      +'<div class="bids">'
      +'<div class="bid win"><b>$'+it.winner.amount+'</b><span>'+esc(teamName(it.winner.roster))+'</span><span class="lbl">paid</span></div>'
      +'<div class="bid"><b>$'+it.loser.amount+'</b><span>'+esc(teamName(it.loser.roster))+'</span><span class="lbl">would not</span></div>'
      +'<div class="bid"><span class="lbl" style="margin-left:0">'
      +num(it.since,1)+' points scored since, over a gap of $'+it.gap+'.</span></div>'
      +'</div></div>';
  });
  return h+'</div>';
}

function loadHistory(){
  if(S.historyPromise) return S.historyPromise;
  var seasons=[];
  function step(id){
    if(!id||seasons.length>=4) return Promise.resolve();
    return Promise.all([
      get("/league/"+id),
      get("/league/"+id+"/users").catch(function(){return [];}),
      get("/league/"+id+"/rosters").catch(function(){return [];}),
      get("/league/"+id+"/winners_bracket").catch(function(){return [];})
    ]).then(function(r){
      var season={league:r[0],users:r[1],rosters:r[2],bracket:r[3],matchups:{}};
      var weeks=[],w;
      for(w=1;w<=17;w++) weeks.push(w);
      return Promise.all(weeks.map(function(w){
        return get("/league/"+id+"/matchups/"+w).catch(function(){return [];});
      })).then(function(ms){
        weeks.forEach(function(w,i){
          var arr=ms[i]||[];
          if(arr.some(function(m){ return (Number(m.points)||0)>0; })) season.matchups[w]=arr;
        });
        seasons.push(season);
        return step(r[0]&&r[0].previous_league_id);
      });
    }).catch(function(){});
  }
  S.historyPromise=step(LEAGUE_ID).then(function(){ S.history=seasons; return seasons; });
  return S.historyPromise;
}

function renderRecords(){
  var box=$("tab-records");
  if(S.history){ paintRecords(box,S.history); return; }
  box.innerHTML='<h2>Record book</h2><div class="msg">Reading every season Sleeper still has. This one takes a few seconds.</div>';
  loadHistory().then(function(seasons){ paintRecords(box,seasons); });
}

function paintRecords(box,seasons){
  if(!seasons||!seasons.length){
    box.innerHTML='<h2>Record book</h2><div class="msg">No season data available.</div>';
    return;
  }

  var weeks=[], careers={};
  seasons.forEach(function(s){
    var uMap={}, rMap={};
    (s.users||[]).forEach(function(u){ uMap[u.user_id]=u; });
    (s.rosters||[]).forEach(function(r){ rMap[r.roster_id]=r; });
    function nm(rid){
      var r=rMap[rid], u=r&&uMap[r.owner_id];
      if(!u) return "Roster "+rid;
      return (u.metadata&&u.metadata.team_name)||u.display_name||("Roster "+rid);
    }
    function owner(rid){ var r=rMap[rid]; return r?r.owner_id:null; }

    var champ=null;
    (s.bracket||[]).forEach(function(m){ if(m&&m.p===1&&m.w) champ=m.w; });

    (s.rosters||[]).forEach(function(r){
      var st=r.settings||{}, uid=r.owner_id;
      if(!uid) return;
      var u=uMap[uid];
      if(!careers[uid]) careers[uid]={name:(u&&u.display_name)||"Unknown",w:0,l:0,t:0,pf:0,titles:0,seasons:0};
      var c=careers[uid];
      c.w+=Number(st.wins)||0; c.l+=Number(st.losses)||0; c.t+=Number(st.ties)||0;
      c.pf+=pts(st.fpts,st.fpts_decimal);
      c.seasons++;
      if(champ===r.roster_id) c.titles++;
    });

    Object.keys(s.matchups).forEach(function(w){
      var g={};
      (s.matchups[w]||[]).forEach(function(m){
        if(m.matchup_id==null) return;
        (g[m.matchup_id]=g[m.matchup_id]||[]).push(m);
      });
      (s.matchups[w]||[]).forEach(function(m){
        weeks.push({season:s.league.season, week:Number(w), rid:m.roster_id,
          name:nm(m.roster_id), points:Number(m.points)||0});
      });
      Object.keys(g).forEach(function(k){
        var p=g[k];
        if(p.length<2) return;
        var a=p[0],b=p[1];
        var pa=Number(a.points)||0, pb=Number(b.points)||0;
        if(!pa&&!pb) return;
        var hi=pa>=pb?a:b, lo=pa>=pb?b:a;
        weeks.push({game:true, season:s.league.season, week:Number(w),
          winner:nm(hi.roster_id), loser:nm(lo.roster_id),
          winPts:Math.max(pa,pb), losePts:Math.min(pa,pb), margin:Math.abs(pa-pb)});
      });
    });
  });

  var singles=weeks.filter(function(x){ return !x.game&&x.points>0; });
  var gamesAll=weeks.filter(function(x){ return x.game; });

  function line(label,val,detail){
    return '<div class="wire-item"><div class="hl"><span class="tag">'+esc(label)+'</span>'+esc(val)+'</div>'
      +'<div class="dt">'+esc(detail)+'</div></div>';
  }

  var html='<h2>Record book</h2><p class="note">Every season linked to this league, all-time.</p><div class="wire">';
  if(singles.length){
    var hi=singles.slice().sort(function(a,b){ return b.points-a.points; })[0];
    var lo=singles.slice().sort(function(a,b){ return a.points-b.points; })[0];
    html+=line("Highest week", hi.name+", "+num(hi.points), hi.season+" week "+hi.week);
    html+=line("Lowest week", lo.name+", "+num(lo.points), lo.season+" week "+lo.week);
  }
  if(gamesAll.length){
    var blow=gamesAll.slice().sort(function(a,b){ return b.margin-a.margin; })[0];
    var close=gamesAll.slice().sort(function(a,b){ return a.margin-b.margin; })[0];
    var painful=gamesAll.slice().sort(function(a,b){ return b.losePts-a.losePts; })[0];
    html+=line("Biggest blowout", blow.winner+" over "+blow.loser+" by "+num(blow.margin),
      blow.season+" week "+blow.week+", "+num(blow.winPts)+" to "+num(blow.losePts));
    html+=line("Closest game", close.winner+" over "+close.loser+" by "+num(close.margin),
      close.season+" week "+close.week);
    html+=line("Most points in a loss", painful.loser+", "+num(painful.losePts),
      painful.season+" week "+painful.week+", beaten by "+painful.winner+"'s "+num(painful.winPts));
  }
  html+='</div>';

  var cr=Object.keys(careers).map(function(k){ return careers[k]; })
    .sort(function(a,b){ return b.titles-a.titles||b.w-a.w||b.pf-a.pf; });
  if(cr.length){
    html+='<h2 style="margin-top:34px">Career records</h2>'
      +'<p class="note">Across every season on file. Managers are matched by account, so a rename does not reset anyone.</p>'
      +'<div class="scroll"><table><thead><tr><th></th><th>Manager</th><th>Record</th><th>Win rate</th><th>Points</th><th>Seasons</th><th>Titles</th></tr></thead><tbody>';
    cr.forEach(function(c,i){
      var g=c.w+c.l+c.t;
      html+='<tr class="rank-'+(i+1)+'"><td>'+(i+1)+'</td>'
        +'<td><div class="team-cell"><div class="tname">'+esc(c.name)+'</div></div></td>'
        +'<td>'+c.w+'-'+c.l+(c.t?'-'+c.t:'')+'</td>'
        +'<td>'+(g?Math.round(100*c.w/g)+'%':'--')+'</td>'
        +'<td>'+num(c.pf,0)+'</td><td>'+c.seasons+'</td><td>'+(c.titles||'')+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }
  box.innerHTML=html;
}

/* ---------- tabs ---------- */
var tabs=Array.prototype.slice.call(document.querySelectorAll('nav button'));
tabs.forEach(function(btn){
  btn.addEventListener("click",function(){
    tabs.forEach(function(b){
      var on=b===btn;
      b.setAttribute("aria-selected",on?"true":"false");
      $("tab-"+b.dataset.tab).hidden=!on;
    });
    if(btn.dataset.tab==="history") renderHistory();
    if(btn.dataset.tab==="records") renderRecords();
  });
});

boot();
})();
</script>
</body>
</html>
