/* ============================================================
   RECORD BOOK
   ============================================================ */
/* ============================================================
   RIVALRIES
   Head-to-head across every season Sleeper still has. Teams get
   renamed constantly, so everything here is keyed on the Sleeper
   owner id, which does not change.
   ============================================================ */

/* Match a name in RIVALRIES to an owner id. Tries the manager map first,
   then display names, then team names, across every season. */
/* Not every site defines a MANAGERS map, so ask for it carefully. */
function managerMap(){
  try { return (typeof MANAGERS !== "undefined" && MANAGERS) ? MANAGERS : {}; }
  catch(e){ return {}; }
}

function resolveManager(label, seasons){
  // A side can be a single name or a list of things that person has been
  // called: real name, Sleeper handle, any team name they have used.
  var wants = (Object.prototype.toString.call(label) === "[object Array]" ? label : [label])
    .map(normKey).filter(Boolean);
  if(!wants.length) return null;
  var hit = null;

  var mm = managerMap();
  Object.keys(mm).forEach(function(uid){
    if(!hit && wants.indexOf(normKey(mm[uid])) >= 0) hit = uid;
  });
  if(hit) return hit;

  function scan(test){
    (seasons||[]).forEach(function(s){
      (s.users||[]).forEach(function(u){
        if(hit) return;
        var dn = normKey(u.display_name||"");
        var tn = normKey((u.metadata&&u.metadata.team_name)||"");
        if(test(dn) || test(tn)) hit = u.user_id;
      });
    });
  }
  scan(function(v){ return v && wants.indexOf(v) >= 0; });
  if(!hit) scan(function(v){
    if(!v) return false;
    for(var i = 0; i < wants.length; i++){ if(v.indexOf(wants[i]) === 0) return true; }
    return false;
  });
  return hit;
}

/* Every owner who has ever appeared, newest name first. */
function allManagers(seasons){
  var out = {}, order = [];
  (seasons||[]).forEach(function(s){
    var uMap = {};
    (s.users||[]).forEach(function(u){ uMap[u.user_id] = u; });
    (s.rosters||[]).forEach(function(r){
      var uid = r.owner_id;
      if(!uid || out[uid]) return;
      var u = uMap[uid];
      out[uid] = managerMap()[uid]
        || (u && u.display_name)
        || (u && u.metadata && u.metadata.team_name)
        || ("Roster " + r.roster_id);
      order.push(uid);
    });
  });
  order.sort(function(a,b){ return out[a].localeCompare(out[b]); });
  return {names: out, order: order};
}

function managerLabel(uid, seasons){
  var all = allManagers(seasons);
  return all.names[uid] || "Unknown";
}

/* Every game these two have played, oldest first. */
function headToHead(ownerA, ownerB, seasons){
  var games = [];
  (seasons||[]).forEach(function(s){
    var rMap = {}, uMap = {};
    (s.rosters||[]).forEach(function(r){ rMap[r.roster_id] = r; });
    (s.users||[]).forEach(function(u){ uMap[u.user_id] = u; });
    var pStart = Number(s.league && s.league.settings && s.league.settings.playoff_week_start) || 99;
    function ownerOf(rid){ var r = rMap[rid]; return r ? r.owner_id : null; }
    function teamOf(rid){
      var r = rMap[rid], u = r && uMap[r.owner_id];
      if(!u) return "Roster " + rid;
      return (u.metadata && u.metadata.team_name) || u.display_name || ("Roster " + rid);
    }
    Object.keys(s.matchups||{}).forEach(function(w){
      var g = {};
      (s.matchups[w]||[]).forEach(function(m){
        if(m.matchup_id == null) return;
        (g[m.matchup_id] = g[m.matchup_id] || []).push(m);
      });
      Object.keys(g).forEach(function(k){
        var p = g[k];
        if(p.length !== 2) return;
        var o0 = ownerOf(p[0].roster_id), o1 = ownerOf(p[1].roster_id), a, b;
        if(o0 === ownerA && o1 === ownerB){ a = p[0]; b = p[1]; }
        else if(o0 === ownerB && o1 === ownerA){ a = p[1]; b = p[0]; }
        else return;
        var pa = Number(a.points)||0, pb = Number(b.points)||0;
        if(!pa && !pb) return;
        games.push({season: s.league.season, week: Number(w), a: pa, b: pb,
                    teamA: teamOf(a.roster_id), teamB: teamOf(b.roster_id),
                    playoff: Number(w) >= pStart});
      });
    });
  });
  games.sort(function(x,y){
    return (Number(x.season) - Number(y.season)) || (x.week - y.week);
  });
  return games;
}

function h2hSummary(games){
  if(!games || !games.length) return null;
  var w=0, l=0, t=0, pfA=0, pfB=0, bigA=null, bigB=null, close=null;
  games.forEach(function(g){
    pfA += g.a; pfB += g.b;
    var m = g.a - g.b;
    if(m > 0) w++; else if(m < 0) l++; else t++;
    if(m > 0 && (!bigA || m > bigA.m)) bigA = {g: g, m: m};
    if(m < 0 && (!bigB || -m > bigB.m)) bigB = {g: g, m: -m};
    if(!close || Math.abs(m) < close.m) close = {g: g, m: Math.abs(m)};
  });
  var streak = 0, dir = null;
  for(var i = games.length - 1; i >= 0; i--){
    var d = games[i].a > games[i].b ? "A" : (games[i].a < games[i].b ? "B" : null);
    if(!d) break;
    if(dir === null){ dir = d; streak = 1; }
    else if(d === dir) streak++;
    else break;
  }
  return {n: games.length, w: w, l: l, t: t, pfA: pfA, pfB: pfB,
          avg: (pfA - pfB) / games.length, bigA: bigA, bigB: bigB,
          close: close, streak: streak, dir: dir,
          playoffs: games.filter(function(g){ return g.playoff; }).length};
}

/* Is a named rivalry on this week's schedule? Used by the briefing. */
function rivalryThisWeek(){
  if(!RIVALRIES.length || !S.rosters.length) return [];
  var sched = schedulesByWeek()[S.week];
  if(!sched) return [];
  var out = [];
  RIVALRIES.forEach(function(r){
    var a = rosterOfOwner(r._a), b = rosterOfOwner(r._b);
    if(a == null || b == null) return;
    if(sched[a] === b) out.push(r);
  });
  return out;
}
function rosterOfOwner(uid){
  for(var i = 0; i < S.rosters.length; i++){
    if(S.rosters[i].owner_id === uid) return S.rosters[i].roster_id;
  }
  return null;
}

function h2hPanel(uidA, uidB, seasons, heading, blurb){
  var nameA = managerLabel(uidA, seasons), nameB = managerLabel(uidB, seasons);
  var games = headToHead(uidA, uidB, seasons);
  var s = h2hSummary(games);
  var h = '';

  if(heading){
    h += '<div class="season-head"><h3>' + esc(heading) + '</h3></div>';
    if(blurb) h += '<p class="note">' + esc(blurb) + '</p>';
  }

  if(!s){
    return h + '<div class="msg">' + esc(nameA) + ' and ' + esc(nameB)
      + ' have never played each other in any season on record.</div>';
  }

  var lead = s.w > s.l ? (esc(nameA) + ' leads ' + s.w + '-' + s.l)
           : s.l > s.w ? (esc(nameB) + ' leads ' + s.l + '-' + s.w)
           : ('Dead level at ' + s.w + '-' + s.l);
  if(s.t) lead += '-' + s.t;

  h += '<div class="wire"><div class="wire-item">'
    + '<div class="hl"><span class="tag">All time</span>' + lead + '</div>'
    + '<div class="dt">' + s.n + ' meeting' + (s.n === 1 ? '' : 's')
    + (s.playoffs ? ', ' + s.playoffs + ' in the playoffs' : '')
    + ' &middot; ' + num(s.pfA, 1) + ' to ' + num(s.pfB, 1)
    + ' &middot; average margin ' + num(Math.abs(s.avg), 1)
    + ' to ' + esc(s.avg >= 0 ? nameA : nameB) + '</div></div>';

  if(s.streak > 1){
    h += '<div class="wire-item"><div class="hl"><span class="tag">Streak</span>'
      + esc(s.dir === "A" ? nameA : nameB) + ' has won the last ' + s.streak + '</div></div>';
  }
  if(s.bigA){
    h += '<div class="wire-item"><div class="hl"><span class="tag">Biggest win</span>'
      + esc(nameA) + ' by ' + num(s.bigA.m, 1) + '</div>'
      + '<div class="dt">' + s.bigA.g.season + ' week ' + s.bigA.g.week + ', '
      + num(s.bigA.g.a, 1) + ' to ' + num(s.bigA.g.b, 1) + '</div></div>';
  }
  if(s.bigB){
    h += '<div class="wire-item"><div class="hl"><span class="tag">Biggest win</span>'
      + esc(nameB) + ' by ' + num(s.bigB.m, 1) + '</div>'
      + '<div class="dt">' + s.bigB.g.season + ' week ' + s.bigB.g.week + ', '
      + num(s.bigB.g.b, 1) + ' to ' + num(s.bigB.g.a, 1) + '</div></div>';
  }
  if(s.close && s.n > 1){
    h += '<div class="wire-item"><div class="hl"><span class="tag">Closest</span>'
      + num(s.close.m, 1) + ' points apart</div>'
      + '<div class="dt">' + s.close.g.season + ' week ' + s.close.g.week + ', '
      + num(s.close.g.a, 1) + ' to ' + num(s.close.g.b, 1) + '</div></div>';
  }
  h += '</div>';

  h += '<div class="scroll"><table><thead><tr><th>Season</th><th>Week</th>'
    + '<th>' + esc(nameA) + '</th><th>' + esc(nameB) + '</th><th>Margin</th><th>Won by</th>'
    + '</tr></thead><tbody>';
  games.slice().reverse().forEach(function(g){
    var m = g.a - g.b;
    var winner = m > 0 ? nameA : (m < 0 ? nameB : "Tie");
    h += '<tr><td>' + esc(g.season) + '</td>'
      + '<td>' + g.week + (g.playoff ? ' <span class="champ">playoff</span>' : '') + '</td>'
      + '<td class="' + (m > 0 ? 'pos' : '') + '">' + num(g.a, 1) + '</td>'
      + '<td class="' + (m < 0 ? 'pos' : '') + '">' + num(g.b, 1) + '</td>'
      + '<td>' + num(Math.abs(m), 1) + '</td>'
      + '<td>' + esc(winner) + '</td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

/* Every pair who has ever met, built in one pass over the seasons. */
function allPairs(seasons){
  var pairs = {};
  (seasons||[]).forEach(function(s){
    var rMap = {};
    (s.rosters||[]).forEach(function(r){ rMap[r.roster_id] = r; });
    var pStart = Number(s.league && s.league.settings && s.league.settings.playoff_week_start) || 99;
    Object.keys(s.matchups||{}).forEach(function(w){
      var g = {};
      (s.matchups[w]||[]).forEach(function(m){
        if(m.matchup_id == null) return;
        (g[m.matchup_id] = g[m.matchup_id] || []).push(m);
      });
      Object.keys(g).forEach(function(k){
        var p = g[k];
        if(p.length !== 2) return;
        var r0 = rMap[p[0].roster_id], r1 = rMap[p[1].roster_id];
        if(!r0 || !r1 || !r0.owner_id || !r1.owner_id) return;
        if((Number(p[0].points)||0) === 0 && (Number(p[1].points)||0) === 0) return;
        // canonical side order, so a pair is the same pair whichever way round it appears
        var first = p[0], second = p[1];
        if(r0.owner_id > r1.owner_id){ first = p[1]; second = p[0]; }
        var oa = rMap[first.roster_id].owner_id, ob = rMap[second.roster_id].owner_id;
        var key = oa + "|" + ob;
        if(!pairs[key]) pairs[key] = {a: oa, b: ob, games: []};
        pairs[key].games.push({season: s.league.season, week: Number(w),
          a: Number(first.points)||0, b: Number(second.points)||0,
          playoff: Number(w) >= pStart});
      });
    });
  });
  Object.keys(pairs).forEach(function(k){
    pairs[k].games.sort(function(x,y){
      return (Number(x.season) - Number(y.season)) || (x.week - y.week);
    });
    pairs[k].sum = h2hSummary(pairs[k].games);
  });
  return pairs;
}

/* The tightest matchups in league history. A rivalry needs volume AND balance:
   plenty of meetings, with neither side ever pulling away. Meetings count for
   one point each, every game of separation costs one and a half, so 6-6 beats
   8-4 and both beat 2-1. */
var RIVALRY_MIN_MEETINGS = 3;

function topRivalries(seasons, limit, precomputed){
  var pairs = precomputed || allPairs(seasons), rows = [];
  Object.keys(pairs).forEach(function(k){
    var p = pairs[k], s = p.sum;
    if(!s) return;
    rows.push({key: k, a: p.a, b: p.b, games: p.games, s: s,
               score: s.n - Math.abs(s.w - s.l) * 1.5});
  });
  // A young league may not have three meetings anywhere yet. Relax rather than
  // show an empty table.
  var min = RIVALRY_MIN_MEETINGS;
  while(min > 1 && rows.filter(function(r){ return r.s.n >= min; }).length < 3) min--;
  rows = rows.filter(function(r){ return r.s.n >= min; });
  rows.sort(function(x,y){
    return (y.score - x.score)
        || (Math.abs(x.s.avg) - Math.abs(y.s.avg))
        || (y.s.n - x.s.n);
  });
  return {rows: rows.slice(0, limit || 10), min: min, total: rows.length};
}

function renderRivalry(){
  var box = $("tab-rivalry");
  if(!box) return;
  if(!S.history){
    box.innerHTML = '<h2>Rivalries</h2><div class="msg">Reading every season Sleeper still has. '
      + 'This one takes a few seconds.</div>';
    loadHistory().then(function(){ renderRivalry(); });
    return;
  }
  var seasons = S.history || [];
  var all = allManagers(seasons);

  RIVALRIES.forEach(function(r){
    if(r._resolved) return;
    r._a = resolveManager(r.between[0], seasons);
    r._b = resolveManager(r.between[1], seasons);
    r._resolved = true;
  });
  var namedBy = {};
  RIVALRIES.forEach(function(r){
    if(r._a && r._b) namedBy[[r._a, r._b].sort().join("|")] = r;
  });

  var pairs = allPairs(seasons);
  var top = topRivalries(seasons, 10, pairs);
  var listed = {};
  top.rows.forEach(function(r){ listed[r.key] = 1; });

  // a named rivalry always gets a row, even if it is lopsided or short
  var extra = [];
  Object.keys(namedBy).forEach(function(k){
    if(listed[k]) return;
    var p = pairs[k];
    if(p && p.sum) extra.push({key: k, a: p.a, b: p.b, games: p.games, s: p.sum, pinned: true});
  });

  var h = '<h2>Top rivalries</h2>'
    + '<p class="note">The matchups nobody can put away. Ranked on meetings and how level the '
    + 'record has stayed &mdash; plenty of games with neither side pulling ahead beats a lopsided '
    + 'series every time. Matched on Sleeper accounts, so renaming your team does not wipe your '
    + 'history. Minimum ' + top.min + ' meeting' + (top.min === 1 ? '' : 's') + '.</p>';

  var rows = top.rows.concat(extra);
  if(!rows.length){
    h += '<div class="msg">Nobody has played anybody twice yet. Come back in a few weeks.</div>';
  } else {
    h += '<div class="scroll"><table><thead><tr><th></th><th>Matchup</th><th>Meetings</th>'
      + '<th>Average margin</th><th>Last met</th></tr></thead><tbody>';
    rows.forEach(function(r, i){
      var s = r.s;
      var nameA = all.names[r.a] || "Unknown", nameB = all.names[r.b] || "Unknown";
      var lead = s.w >= s.l ? nameA : nameB;
      var trail = s.w >= s.l ? nameB : nameA;
      var hi = Math.max(s.w, s.l), lo = Math.min(s.w, s.l);
      var last = r.games[r.games.length - 1];
      var named = namedBy[r.key];
      h += '<tr class="riv-row ' + (r.pinned ? '' : 'rank-' + (i + 1)) + '" '
        + 'data-a="' + esc(r.a) + '" data-b="' + esc(r.b) + '">'
        + '<td>' + (r.pinned ? '&mdash;' : (i + 1)) + '</td>'
        + '<td><div class="tname">' + esc(lead) + ' ' + hi + '&ndash;' + lo + ' ' + esc(trail)
        + (s.t ? ' (' + s.t + ' tied)' : '') + '</div>'
        + (named ? '<div class="mgr" style="color:var(--gold)">' + esc(named.name) + '</div>' : '')
        + '</td>'
        + '<td>' + s.n + (s.playoffs ? ' <span class="champ">' + s.playoffs + ' playoff</span>' : '') + '</td>'
        + '<td>' + num(Math.abs(s.avg), 1) + '</td>'
        + '<td>' + esc(last.season) + ' wk ' + last.week + '</td>'
        + '</tr>';
    });
    h += '</tbody></table></div>'
      + '<p class="note">Tap any row to open the full history below.</p>';
  }

  h += '<div class="season-head"><h3>Any two managers</h3></div>'
    + '<div class="picker">'
    + '<select id="rivA">' + all.order.map(function(uid){
        return '<option value="' + esc(uid) + '">' + esc(all.names[uid]) + '</option>';
      }).join('') + '</select>'
    + '<span class="note" style="margin:0">against</span>'
    + '<select id="rivB">' + all.order.map(function(uid){
        return '<option value="' + esc(uid) + '">' + esc(all.names[uid]) + '</option>';
      }).join('') + '</select></div>'
    + '<div id="rivOut"></div>';

  RIVALRIES.filter(function(r){ return !r._a || !r._b; }).forEach(function(r){
    h += '<div class="msg bad">Could not match &ldquo;' + esc(r.name) + '&rdquo; to two managers: '
      + esc(r.between.map(function(x){ return [].concat(x).join("/"); }).join(" and "))
      + ' is not resolving to a Sleeper account.</div>';
  });

  box.innerHTML = h;

  var selA = $("rivA"), selB = $("rivB");
  if(!selA || !selB) return;
  if(all.order.length > 1) selB.selectedIndex = 1;
  function paint(){
    var a = selA.value, b = selB.value;
    $("rivOut").innerHTML = (a === b)
      ? '<div class="msg">Pick two different managers.</div>'
      : h2hPanel(a, b, seasons, null, namedBy[[a, b].sort().join("|")]
          ? namedBy[[a, b].sort().join("|")].blurb : null);
  }
  selA.addEventListener("change", paint);
  selB.addEventListener("change", paint);
  Array.prototype.forEach.call(box.querySelectorAll(".riv-row"), function(tr){
    tr.addEventListener("click", function(){
      selA.value = tr.dataset.a;
      selB.value = tr.dataset.b;
      paint();
      var out = $("rivOut");
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      try { out.scrollIntoView({behavior: reduce ? "auto" : "smooth", block: "start"}); }
      catch(e){ out.scrollIntoView(); }
    });
  });
  paint();
}

function loadHistory(){
  if(S.historyPromise) return S.historyPromise;
  var seasons=[];
  function step(id){
    if(!id||seasons.length>=4) return Promise.resolve();
    return Promise.all([
      get("/league/"+id),
      get("/league/"+id+"/users").catch(function(){return [];}),
      get("/league/"+id+"/rosters").catch(function(){return [];}),
      get("/league/"+id+"/winners_bracket").catch(function(){return [];})
    ]).then(function(r){
      var season={league:r[0],users:r[1],rosters:r[2],bracket:r[3],matchups:{}};
      var weeks=[],w;
      for(w=1;w<=17;w++) weeks.push(w);
      return Promise.all(weeks.map(function(w){
        return get("/league/"+id+"/matchups/"+w).catch(function(){return [];});
      })).then(function(ms){
        weeks.forEach(function(w,i){
          var arr=ms[i]||[];
          if(arr.some(function(m){ return (Number(m.points)||0)>0; })) season.matchups[w]=arr;
        });
        seasons.push(season);
        return step(r[0]&&r[0].previous_league_id);
      });
    }).catch(function(){});
  }
  S.historyPromise=step(LEAGUE_ID).then(function(){ S.history=seasons; return seasons; });
  return S.historyPromise;
}

function renderRecords(){
  var box=$("tab-records");
  if(S.history){ paintRecords(box,S.history); return; }
  box.innerHTML='<h2>Record book</h2><div class="msg">Reading every season Sleeper still has. This one takes a few seconds.</div>';
  loadHistory().then(function(seasons){ paintRecords(box,seasons); });
}

function paintRecords(box,seasons){
  if(!seasons||!seasons.length){
    box.innerHTML='<h2>Record book</h2><div class="msg">No season data available.</div>';
    return;
  }

  var weeks=[], careers={};
  seasons.forEach(function(s){
    var uMap={}, rMap={};
    (s.users||[]).forEach(function(u){ uMap[u.user_id]=u; });
    (s.rosters||[]).forEach(function(r){ rMap[r.roster_id]=r; });
    function nm(rid){
      var r=rMap[rid], u=r&&uMap[r.owner_id];
      if(!u) return "Roster "+rid;
      return (u.metadata&&u.metadata.team_name)||u.display_name||("Roster "+rid);
    }
    function owner(rid){ var r=rMap[rid]; return r?r.owner_id:null; }

    var champ=null;
    (s.bracket||[]).forEach(function(m){ if(m&&m.p===1&&m.w) champ=m.w; });

    (s.rosters||[]).forEach(function(r){
      var st=r.settings||{}, uid=r.owner_id;
      if(!uid) return;
      var u=uMap[uid];
      if(!careers[uid]) careers[uid]={name:(u&&u.display_name)||"Unknown",w:0,l:0,t:0,pf:0,titles:0,seasons:0};
      var c=careers[uid];
      c.w+=Number(st.wins)||0; c.l+=Number(st.losses)||0; c.t+=Number(st.ties)||0;
      c.pf+=pts(st.fpts,st.fpts_decimal);
      c.seasons++;
      if(champ===r.roster_id) c.titles++;
    });

    Object.keys(s.matchups).forEach(function(w){
      var g={};
      (s.matchups[w]||[]).forEach(function(m){
        if(m.matchup_id==null) return;
        (g[m.matchup_id]=g[m.matchup_id]||[]).push(m);
      });
      (s.matchups[w]||[]).forEach(function(m){
        weeks.push({season:s.league.season, week:Number(w), rid:m.roster_id,
          name:nm(m.roster_id), points:Number(m.points)||0});
      });
      Object.keys(g).forEach(function(k){
        var p=g[k];
        if(p.length<2) return;
        var a=p[0],b=p[1];
        var pa=Number(a.points)||0, pb=Number(b.points)||0;
        if(!pa&&!pb) return;
        var hi=pa>=pb?a:b, lo=pa>=pb?b:a;
        weeks.push({game:true, season:s.league.season, week:Number(w),
          winner:nm(hi.roster_id), loser:nm(lo.roster_id),
          winPts:Math.max(pa,pb), losePts:Math.min(pa,pb), margin:Math.abs(pa-pb)});
      });
    });
  });

  var singles=weeks.filter(function(x){ return !x.game&&x.points>0; });
  var gamesAll=weeks.filter(function(x){ return x.game; });

  function line(label,val,detail){
    return '<div class="wire-item"><div class="hl"><span class="tag">'+esc(label)+'</span>'+esc(val)+'</div>'
      +'<div class="dt">'+esc(detail)+'</div></div>';
  }

  var html='<h2>Record book</h2><p class="note">Every season linked to this league, all-time.</p><div class="wire">';
  if(singles.length){
    var hi=singles.slice().sort(function(a,b){ return b.points-a.points; })[0];
    var lo=singles.slice().sort(function(a,b){ return a.points-b.points; })[0];
    html+=line("Highest week", hi.name+", "+num(hi.points), hi.season+" week "+hi.week);
    html+=line("Lowest week", lo.name+", "+num(lo.points), lo.season+" week "+lo.week);
  }
  if(gamesAll.length){
    var blow=gamesAll.slice().sort(function(a,b){ return b.margin-a.margin; })[0];
    var close=gamesAll.slice().sort(function(a,b){ return a.margin-b.margin; })[0];
    var painful=gamesAll.slice().sort(function(a,b){ return b.losePts-a.losePts; })[0];
    html+=line("Biggest blowout", blow.winner+" over "+blow.loser+" by "+num(blow.margin),
      blow.season+" week "+blow.week+", "+num(blow.winPts)+" to "+num(blow.losePts));
    html+=line("Closest game", close.winner+" over "+close.loser+" by "+num(close.margin),
      close.season+" week "+close.week);
    html+=line("Most points in a loss", painful.loser+", "+num(painful.losePts),
      painful.season+" week "+painful.week+", beaten by "+painful.winner+"'s "+num(painful.winPts));
  }
  html+='</div>';

  var cr=Object.keys(careers).map(function(k){ return careers[k]; })
    .sort(function(a,b){ return b.titles-a.titles||b.w-a.w||b.pf-a.pf; });
  if(cr.length){
    html+='<h2 style="margin-top:34px">Career records</h2>'
      +'<p class="note">Across every season on file. Managers are matched by account, so a rename does not reset anyone.</p>'
      +'<div class="scroll"><table><thead><tr><th></th><th>Manager</th><th>Record</th><th>Win rate</th><th>Points</th><th>Seasons</th><th>Titles</th></tr></thead><tbody>';
    cr.forEach(function(c,i){
      var g=c.w+c.l+c.t;
      html+='<tr class="rank-'+(i+1)+'"><td>'+(i+1)+'</td>'
        +'<td><div class="team-cell"><div class="tname">'+esc(c.name)+'</div></div></td>'
        +'<td>'+c.w+'-'+c.l+(c.t?'-'+c.t:'')+'</td>'
        +'<td>'+(g?Math.round(100*c.w/g)+'%':'--')+'</td>'
        +'<td>'+num(c.pf,0)+'</td><td>'+c.seasons+'</td><td>'+(c.titles||'')+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }
  box.innerHTML=html;
}

/* ---------- tabs ---------- */
var tabs=Array.prototype.slice.call(document.querySelectorAll('nav button'));
tabs.forEach(function(btn){
  btn.addEventListener("click",function(){
    tabs.forEach(function(b){
      var on=b===btn;
      b.setAttribute("aria-selected",on?"true":"false");
      $("tab-"+b.dataset.tab).hidden=!on;
    });
    if(btn.dataset.tab==="history") renderHistory();
    if(btn.dataset.tab==="records") renderRecords();
    if(btn.dataset.tab==="rivalry") renderRivalry();
    if(btn.dataset.tab==="book") renderBook();
  });
});

boot();
})();
